<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DRONE PFD v8.2 — FIXED</title>
    <style>
        :root { --color: #00ff41; }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: var(--color); }
        
        #cam { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; 
               filter: brightness(0.6) contrast(1.4) sepia(0.2) hue-rotate(88deg); }
        
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 15;
                     background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,255,0,0.05) 50%),
                                 linear-gradient(90deg, rgba(255,0,0,0.02), rgba(0,255,0,0.01), rgba(0,0,255,0.02));
                     background-size: 100% 4px, 3px 100%; pointer-events: none; }
        
        .status-bar {
            position: fixed; top: 12px; left: 20px; z-index: 200; font-size: 13px;
            text-shadow: 0 0 8px var(--color);
        }
        
        #debug {
            position: fixed; bottom: 120px; left: 20px; z-index: 200; 
            background: rgba(0,0,0,0.85); padding: 10px 14px; border: 1px solid #0f0;
            font-size: 11px; line-height: 1.4; display: block; width: 220px;
        }
        
        #info { 
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); padding: 10px 20px; border: 1px solid var(--color);
            font-size: 13px; z-index: 200; display: none; text-align: center;
        }
    </style>
</head>
<body>

<video id="cam" autoplay playsinline muted webkit-playsinline></video>
<div class="scanlines"></div>
<canvas id="canvas"></canvas>

<div class="status-bar" id="status-bar">ПРОВЕРКА ДАТЧИКОВ...</div>
<div id="debug"></div>
<div id="info">ГИРОСКОП НЕ ОТВЕЧАЕТ</div>

<button id="reset-btn" style="position:fixed;bottom:30px;right:30px;z-index:200;background:rgba(0,255,65,0.1);border:1px solid #0f0;color:#0f0;padding:14px 24px;font-size:14px;cursor:pointer;display:none;" onclick="resetHorizon()">
    ЦЕНТР ГОРИЗОНТА + КАЛИБРОВКА
</button>

<div id="boot" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:300;background:rgba(0,0,0,0.95);display:flex;align-items:center;justify-content:center;">
    <div style="background:#000;border:2px solid #0f0;padding:40px 30px;text-align:center;max-width:92%;">
        <h1 style="font-size:26px;letter-spacing:4px;margin-bottom:10px;">DRONE PFD v8.2</h1>
        <p style="margin-bottom:20px;font-size:14px;">ЛЕВЫЙ: КРЕН | ПРАВЫЙ: ВЫСОТА</p>
        <p style="font-size:12px;margin-bottom:25px;">Установите телефон ровно относительно дрона</p>
        <button onclick="boot()" style="background:#0f0;color:#000;border:none;padding:18px 60px;font-weight:bold;font-size:17px;cursor:pointer;">ЗАПУСТИТЬ</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('cam');
    const statusBar = document.getElementById('status-bar');
    const debugPanel = document.getElementById('debug');
    const info = document.getElementById('info');

    let state = {
        rawPitch: 0, rawRoll: 0, rawHeading: 0,
        pitch: 0, roll: 0, heading: 0,
        offsetPitch: 0, offsetRoll: 0,
        gyroActive: false,
        lastUpdate: 0,
        active: false,
        frame: 0
    };

    async function requestSensors() {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            try { await DeviceOrientationEvent.requestPermission(); } catch(e){}
        }
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
            try { await DeviceMotionEvent.requestPermission(); } catch(e){}
        }
    }

    function boot() {
        document.getElementById('boot').style.display = 'none';
        document.getElementById('reset-btn').style.display = 'block';

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; video.play(); })
            .catch(() => {});

        requestSensors().then(() => {
            window.addEventListener('deviceorientation', handleOrientation, { passive: true });
        });

        state.active = true;
        animate();
        setInterval(updateDebugAndStatus, 100);
    }

    function handleOrientation(e) {
        if (!e) return;
        state.gyroActive = true;
        info.style.display = 'none';

        // Стабилизированные сырые данные
        state.rawPitch = e.beta || 0;
        state.rawRoll  = e.gamma || 0;
        
        if (e.webkitCompassHeading !== undefined) {
            state.rawHeading = e.webkitCompassHeading;
        } else {
            state.rawHeading = e.alpha || 0;
        }
        
        state.lastUpdate = Date.now();
    }

    function resetHorizon() {
        state.offsetPitch = state.rawPitch;
        state.offsetRoll  = state.rawRoll;
        if (navigator.vibrate) navigator.vibrate(50);
    }

    function updateDebugAndStatus() {
        const isLive = (Date.now() - state.lastUpdate) < 1000;
        debugPanel.innerHTML = `
            <b>SYSTEM DATA</b><br>
            ROLL (L-TAPE): <span style="color:#0f0">${state.roll.toFixed(1)}°</span><br>
            PITCH (CENTER): <span style="color:#0f0">${state.pitch.toFixed(1)}°</span><br>
            HEADING: <span style="color:#0f0">${state.heading.toFixed(0)}°</span><br><br>
            <span style="color:${isLive ? '#0f0' : '#f00'}">${isLive ? 'SENSORS OK' : 'SENSOR ERROR'}</span>
        `;
        statusBar.innerHTML = `SYS: ACTIVE | GYRO: ${state.gyroActive ? 'OK' : 'ERR'}`;
    }

    function drawHorizon() {
        const w = canvas.width, h = canvas.height;
        const cx = w/2, cy = h/2;

        // Плавная фильтрация для предотвращения "сальто" и рывков
        state.pitch = state.pitch * 0.85 + ((state.rawPitch - state.offsetPitch) * 0.15);
        state.roll  = state.roll  * 0.85 + ((state.rawRoll  - state.offsetRoll)  * 0.15);
        state.heading = state.rawHeading;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(state.roll * Math.PI / 180);

        const pitchY = state.pitch * 8; 

        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#0f0';

        // Линия горизонта
        ctx.beginPath();
        ctx.moveTo(-w, pitchY);
        ctx.lineTo(w, pitchY);
        ctx.stroke();

        // Шкала тангажа в центре
        ctx.lineWidth = 2;
        ctx.textAlign = 'center';
        for (let i = -60; i <= 60; i += 10) {
            if (i === 0) continue;
            const y = pitchY - i * 8;
            ctx.beginPath();
            ctx.moveTo(-50, y);
            ctx.lineTo(50, y);
            ctx.stroke();
            ctx.fillText(Math.abs(i), 70, y + 5);
            ctx.fillText(Math.abs(i), -70, y + 5);
        }
        ctx.restore();
    }

    function drawTape(x, y, value, label, side, unit) {
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 2;
        ctx.strokeRect(side === 'L' ? -50 : 0, -140, 50, 280);

        // Масштаб: 1 единица = 5 пикселей
        const start = Math.floor(value / 10) * 10 - 30;
        ctx.font = '12px monospace';
        ctx.fillStyle = '#0f0';
        
        for (let i = start; i <= start + 60; i += 10) {
            const pos = (value - i) * 6;
            if (Math.abs(pos) > 130) continue;
            ctx.beginPath();
            ctx.moveTo(side === 'L' ? -15 : 0, pos);
            ctx.lineTo(side === 'L' ? 0 : 15, pos);
            ctx.stroke();
            ctx.fillText(i, side === 'L' ? -35 : 25, pos + 4);
        }
        
        // Цифровое табло в центре барабана
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(side === 'L' ? -55 : -5, -20, 60, 40);
        ctx.strokeStyle = '#0f0';
        ctx.strokeRect(side === 'L' ? -55 : -5, -20, 60, 40);
        ctx.fillStyle = '#0f0';
        ctx.font = 'bold 18px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(Math.round(value), side === 'L' ? -25 : 25, 7);
        
        ctx.font = 'bold 12px monospace';
        ctx.fillText(label, side === 'L' ? -25 : 25, -150);
        ctx.restore();
    }

    function animate() {
        if (!state.active) return;
        state.frame++;
        const w = canvas.width = window.innerWidth;
        const h = canvas.height = window.innerHeight;
        
        drawHorizon();

        // ЛЕВЫЙ БАРАБАН: КРЕН (Roll)
        drawTape(120, h/2, state.roll, "ROLL", "L", "°");
        
        // ПРАВЫЙ БАРАБАН: ВЫСОТА (Alt - демо)
        const demoAlt = 150 + Math.sin(state.frame/50)*10;
        drawTape(w - 120, h/2, demoAlt, "ALT", "R", "FT");

        // Прицел
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(w/2, h/2, 20, 0, Math.PI*2);
        ctx.moveTo(w/2-40, h/2); ctx.lineTo(w/2-20, h/2);
        ctx.moveTo(w/2+40, h/2); ctx.lineTo(w/2+20, h/2);
        ctx.stroke();

        ctx.font = 'bold 20px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`HDG ${Math.round(state.heading)}°`, w/2, 80);

        requestAnimationFrame(animate);
    }
</script>
</body>
</html>
