<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DRONE PFD v8.0 — АВИАЦИОННЫЙ ИНТЕРФЕЙС</title>
    <style>
        :root { --color: #00ff41; --bg: rgba(0, 50, 0, 0.2); }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        
        #cam { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; 
               filter: brightness(0.65) contrast(1.45) sepia(0.25) hue-rotate(88deg); }
        
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
                   background: radial-gradient(circle, transparent 20%, #000 150%);
                   display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .terminal { background: #000; border: 1px solid var(--color); padding: 30px; box-shadow: 0 0 20px var(--color); color: var(--color); text-align: center; }
        
        .btn { background: var(--color); color: #000; border: none; padding: 15px 40px; font-weight: bold; 
               font-family: inherit; cursor: pointer; margin-top: 20px; letter-spacing: 2px; }

        #reset-btn {
            position: fixed; bottom: 30px; right: 30px; z-index: 200;
            background: rgba(0,255,65,0.1); border: 1px solid var(--color); color: var(--color);
            padding: 12px 20px; font-size: 12px; font-family: inherit; cursor: pointer;
            backdrop-filter: blur(5px); display: none;
        }

        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 15;
                     background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 255, 0, 0.05) 50%), 
                                 linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
                     background-size: 100% 4px, 3px 100%; pointer-events: none; }
        
        .status-bar {
            position: fixed;
            top: 10px;
            left: 20px;
            z-index: 200;
            color: var(--color);
            font-size: 13px;
            font-family: inherit;
            text-shadow: 0 0 8px var(--color);
        }
    </style>
</head>
<body>

<video id="cam" autoplay playsinline muted webkit-playsinline></video>
<div class="scanlines"></div>
<canvas id="canvas"></canvas>

<div class="status-bar" id="status-bar"></div>

<button id="reset-btn" onclick="resetHorizon()">ЦЕНТР ГОРИЗОНТА</button>

<div id="boot" class="overlay">
    <div class="terminal">
        <h1 style="font-size: 22px; letter-spacing: 4px;">[ DRONE PFD v8.0 ]</h1>
        <p style="font-size: 11px; margin: 15px 0; color: #0f0;">СИСТЕМА ИНИЦИАЛИЗИРОВАНА</p>
        <p style="font-size: 10px; margin: 8px 0;">КАМЕРА: АКТИВНА | ГИРО/АКСЕЛ: АКТИВНЫ | GPS: ОЖИДАНИЕ</p>
        <button class="btn" onclick="boot()">ЗАПУСТИТЬ АВИАЦИОННЫЙ ИНТЕРФЕЙС</button>
        <p style="font-size: 9px; margin-top: 25px; opacity: 0.6;">iPhone 15 • Ретранслятор дрона • Полноценный PFD</p>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('cam');
    const statusBar = document.getElementById('status-bar');
    
    let state = { 
        rawP: 0, rawR: 0,          // Прямые данные гироскопа
        smoothP: 0, smoothR: 0,    // Сглаженные тангаж/крен
        offP: 0, offR: 0,          // Калибровка
        h: 0,                      // Курс
        s: 0, a: 0, vsi: 0,        // Скорость (узлы), высота (футы), вертикальная скорость (фут/мин)
        batt: 100,                 // Заряд батареи %
        lat: 0, lon: 0,            // Координаты
        lastAlt: 0,
        lastAltTime: 0,
        active: false,
        frame: 0,
        gpsFix: false
    };

    function boot() {
        // Камера (задняя, для FPV)
        navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: "environment",
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            } 
        })
        .then(s => { 
            video.srcObject = s; 
            video.play(); 
        })
        .catch(e => {
            console.error(e);
            alert("КАМЕРА НЕДОСТУПНА: " + e.message);
        });

        // Гироскоп / ориентация (тангаж + крен)
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission()
                .then(res => { 
                    if (res === 'granted') {
                        window.addEventListener('deviceorientation', handleGyro);
                    } else {
                        alert("РАЗРЕШИТЕ ДОСТУП К ДАТЧИКАМ");
                    }
                })
                .catch(e => alert("SENSORS BLOCKED"));
        } else {
            window.addEventListener('deviceorientation', handleGyro);
        }

        // GPS + высота + скорость + курс (реальные данные дрона)
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                (position) => {
                    state.gpsFix = true;
                    
                    // Скорость (м/с → узлы)
                    if (position.coords.speed !== null) {
                        state.s = Math.round(position.coords.speed * 1.94384);
                    }
                    
                    // Высота (метры → футы) + VSI
                    if (position.coords.altitude !== null) {
                        const currentAltFt = position.coords.altitude * 3.28084;
                        const now = Date.now();
                        
                        if (state.lastAltTime !== 0) {
                            const deltaT = (now - state.lastAltTime) / 1000;
                            if (deltaT > 0.2) {
                                const deltaAlt = currentAltFt - state.lastAlt;
                                state.vsi = Math.round((deltaAlt / deltaT) * 60); // фут/мин
                            }
                        }
                        
                        state.lastAlt = currentAltFt;
                        state.lastAltTime = now;
                        state.a = Math.round(currentAltFt);
                    }
                    
                    // Курс (истинный)
                    if (position.coords.heading !== null) {
                        state.h = position.coords.heading;
                    }
                    
                    // Координаты
                    state.lat = position.coords.latitude;
                    state.lon = position.coords.longitude;
                },
                (error) => {
                    console.warn("GPS error:", error);
                    state.gpsFix = false;
                },
                { 
                    enableHighAccuracy: true, 
                    maximumAge: 0, 
                    timeout: 3000 
                }
            );
        }

        // Батарея iPhone 15
        if (navigator.getBattery) {
            navigator.getBattery().then(battery => {
                const updateBattery = () => {
                    state.batt = Math.round(battery.level * 100);
                };
                updateBattery();
                battery.addEventListener('levelchange', updateBattery);
            });
        }

        // Запуск интерфейса
        document.getElementById('boot').style.display = 'none';
        document.getElementById('reset-btn').style.display = 'block';
        state.active = true;
        animate();
        
        // Статус-бар (обновляется каждые 2 сек)
        setInterval(updateStatusBar, 2000);
    }

    function handleGyro(e) {
        // Ограничение резких скачков
        state.rawP = e.beta || 0;   // Тангаж
        state.rawR = e.gamma || 0;  // Крен
        state.h = e.webkitCompassHeading || e.alpha || state.h;
    }

    function resetHorizon() {
        state.offP = state.rawP;
        state.offR = state.rawR;
        // Кратковременная вибрация (iPhone)
        if (navigator.vibrate) navigator.vibrate(80);
    }

    function drawHorizon() {
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        
        // Сглаживание (Lerp)
        state.smoothP += ((state.rawP - state.offP) - state.smoothP) * 0.12;
        state.smoothR += ((state.rawR - state.offR) - state.smoothR) * 0.12;

        ctx.save();
        ctx.translate(cx, cy);
        
        // Вращение по крену
        ctx.rotate(state.smoothR * Math.PI / 180);
        
        // Смещение по тангажу (1° = 9 пикселей — более чувствительно)
        const pY = state.smoothP * 9;

        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#0f0';

        // Основная линия горизонта (толще и ярче)
        ctx.beginPath();
        ctx.moveTo(-220, pY);
        ctx.lineTo(220, pY);
        ctx.stroke();

        // Лестница тангажа (более плотная и авиационная)
        ctx.lineWidth = 1.5;
        ctx.font = "bold 11px monospace";
        ctx.textAlign = "center";
        
        for (let i = -70; i <= 70; i += 5) {
            if (i === 0) continue;
            const y = pY - (i * 9);
            if (Math.abs(y) > canvas.height / 1.8) continue;

            ctx.beginPath();
            ctx.setLineDash(i % 10 === 0 ? [] : [3, 2]);
            ctx.moveTo(-45, y);
            ctx.lineTo(45, y);
            ctx.stroke();
            ctx.setLineDash([]);

            // Числа только каждые 10°
            if (i % 10 === 0) {
                ctx.fillStyle = '#0f0';
                ctx.fillText(i.toString(), 65, y + 4);
                ctx.fillText(i.toString(), -65, y + 4);
            }
        }
        ctx.restore();
    }

    function drawRollScale() {
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const radius = 138; // Радиус дуги крена (над горизонтом)

        ctx.save();
        ctx.translate(cx, cy);
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#0f0';

        // Дуга крена (-60° … +60°)
        ctx.beginPath();
        ctx.arc(0, 0, radius, -Math.PI / 2 - (60 * Math.PI / 180), -Math.PI / 2 + (60 * Math.PI / 180));
        ctx.stroke();

        // Метки и подписи
        const angles = [-60, -45, -30, -20, -10, 0, 10, 20, 30, 45, 60];
        ctx.font = "bold 12px monospace";
        ctx.textAlign = "center";
        ctx.fillStyle = '#0f0';

        for (let ang of angles) {
            const rad = -Math.PI / 2 + (ang * Math.PI / 180);
            const x1 = Math.cos(rad) * radius;
            const y1 = Math.sin(rad) * radius;
            const x2 = Math.cos(rad) * (radius + (Math.abs(ang) % 30 === 0 ? 22 : 14));
            const y2 = Math.sin(rad) * (radius + (Math.abs(ang) % 30 === 0 ? 22 : 14));

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            // Подписи только основных меток
            if (Math.abs(ang) % 30 === 0 || ang === 0) {
                const labelX = Math.cos(rad) * (radius + 38);
                const labelY = Math.sin(rad) * (radius + 38) + 5;
                ctx.fillText(Math.abs(ang).toString(), labelX, labelY);
            }
        }

        // Указатель крена (треугольник) — поворачивается вместе с креном
        ctx.rotate(state.smoothR * Math.PI / 180);
        ctx.fillStyle = '#0f0';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.moveTo(0, -radius - 12);           // Вершина треугольника
        ctx.lineTo(-11, -radius + 8);
        ctx.lineTo(11, -radius + 8);
        ctx.closePath();
        ctx.fill();

        // Маленькая чёрточка на 0° (для ясности)
        ctx.fillStyle = '#000';
        ctx.fillRect(-3, -radius - 8, 6, 4);
        ctx.restore();
    }

    function drawTape(x, y, value, label, side, unit = '') {
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#0f0';
        
        // Рамка ленты
        ctx.strokeRect(side === 'L' ? -42 : 0, -138, 42, 276);
        ctx.clip(new Path2D(`M ${side === 'L' ? -42 : 0} -138 h 42 v 276 h -42 Z`));

        // Движущаяся шкала
        const start = Math.floor(value / 10) * 10 - 50;
        for (let i = start; i <= start + 100; i += 10) {
            const yPos = (value - i) * 6.5;
            ctx.beginPath();
            ctx.moveTo(side === 'L' ? -12 : 0, yPos);
            ctx.lineTo(side === 'L' ? 0 : 12, yPos);
            ctx.stroke();
            
            ctx.font = "10px monospace";
            ctx.fillStyle = '#0f0';
            ctx.fillText(i.toString(), side === 'L' ? -34 : 18, yPos + 4);
        }
        ctx.restore();

        // Цифровое значение + единицы
        ctx.fillStyle = "rgba(0,255,0,0.2)";
        ctx.fillRect(side === 'L' ? x - 48 : x - 8, y - 18, 55, 36);
        
        ctx.fillStyle = "#0f0";
        ctx.font = "bold 19px monospace";
        ctx.textAlign = "center";
        ctx.fillText(Math.round(value), side === 'L' ? x - 29 : x + 12, y + 8);
        
        // Единицы измерения
        ctx.font = "9px monospace";
        ctx.fillText(unit, side === 'L' ? x - 29 : x + 12, y + 28);
        
        // Название параметра сверху
        ctx.font = "9px monospace";
        ctx.fillText(label, side === 'L' ? x - 29 : x + 12, y - 145);
    }

    function drawVSI(x, y, value) {
        const range = 2000; // ±2000 фут/мин
        const height = 210;
        const scale = height / (range * 2);

        ctx.save();
        ctx.translate(x, y);
        
        // Фон VSI
        ctx.fillStyle = "rgba(0,255,0,0.12)";
        ctx.fillRect(-22, -height/2, 44, height);
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 2;
        ctx.strokeRect(-22, -height/2, 44, height);

        // Центральная линия (0)
        ctx.beginPath();
        ctx.moveTo(-18, 0);
        ctx.lineTo(18, 0);
        ctx.stroke();

        // Метки шкалы
        for (let i = -1800; i <= 1800; i += 300) {
            const yp = -i * scale;
            ctx.beginPath();
            ctx.moveTo(-18, yp);
            ctx.lineTo(-8, yp);
            ctx.stroke();
            
            if (Math.abs(i) === 600 || Math.abs(i) === 1200 || i === 0) {
                ctx.font = "9px monospace";
                ctx.fillStyle = '#0f0';
                ctx.textAlign = "right";
                ctx.fillText((i / 100).toString(), -26, yp + 4);
            }
        }

        // Указатель VSI
        const clamped = Math.max(Math.min(value, range), -range);
        const pointerY = -clamped * scale;
        
        ctx.fillStyle = '#0f0';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#0f0';
        ctx.beginPath();
        ctx.moveTo(22, pointerY);
        ctx.lineTo(8, pointerY - 9);
        ctx.lineTo(8, pointerY + 9);
        ctx.closePath();
        ctx.fill();

        // Цифровое значение VSI
        ctx.font = "bold 13px monospace";
        ctx.textAlign = "center";
        ctx.fillText(Math.round(value).toString(), 0, pointerY + 42);

        // Подпись
        ctx.font = "9px monospace";
        ctx.fillText("VSI", 0, -height/2 - 12);
        ctx.fillText("ft/min", 0, height/2 + 22);
        
        ctx.restore();
    }

    function updateStatusBar() {
        const fix = state.gpsFix ? "✅ GPS FIX" : "⚠️ NO GPS";
        statusBar.innerHTML = `
            BATT <span style="color:#0f0">${state.batt}%</span> &nbsp;&nbsp;
            ${fix} &nbsp;&nbsp;
            LAT ${state.lat.toFixed(4)} LON ${state.lon.toFixed(4)}
        `;
    }

    function animate() {
        if (!state.active) return;
        state.frame++;
        
        const w = canvas.width = window.innerWidth;
        const h = canvas.height = window.innerHeight;
        
        ctx.clearRect(0, 0, w, h);

        // Основные элементы авиационного PFD
        drawHorizon();
        drawRollScale();                    // Полноценный индикатор крена
        drawTape(115, h/2, state.s, "GS", "L", "KT");   // Скорость в узлах
        drawTape(w - 115, h/2, state.a, "ALT", "R", "FT"); // Высота в футах
        drawVSI(w - 52, h/2, state.vsi);   // Вертикальная скорость

        // Прицел (реticle)
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 2.5;
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#0f0';
        ctx.beginPath();
        ctx.arc(w/2, h/2, 14, 0, Math.PI * 2);
        ctx.moveTo(w/2 - 32, h/2); ctx.lineTo(w/2 - 14, h/2);
        ctx.moveTo(w/2 + 32, h/2); ctx.lineTo(w/2 + 14, h/2);
        ctx.moveTo(w/2, h/2 - 32); ctx.lineTo(w/2, h/2 - 14);
        ctx.moveTo(w/2, h/2 + 32); ctx.lineTo(w/2, h/2 + 14);
        ctx.stroke();

        // Курс (цифровой + крупнее)
        ctx.font = "bold 18px monospace";
        ctx.textAlign = "center";
        ctx.fillStyle = '#0f0';
        ctx.shadowBlur = 10;
        ctx.fillText("HDG " + Math.round(state.h).toString().padStart(3, '0') + "°", w/2, 68);

        requestAnimationFrame(animate);
    }

    // Автоматический запуск при повороте/ориентации (для удобства на дроне)
    window.addEventListener('load', () => {
        console.log('%c🚁 DRONE PFD v8.0 загружен для iPhone 15', 'color:#0f0; font-family:monospace;');
    });
</script>
</body>
</html>
