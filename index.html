<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FPV HUD V9.0 | HORIZON FIXED</title>
    <style>
        :root { --green: #00ff41; --shadow: rgba(0, 255, 65, 0.2); }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; }
        body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: var(--green); }
        
        #cam { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; 
               filter: brightness(0.6) contrast(1.3) sepia(0.2) hue-rotate(85deg); }
        
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        #ui-boot { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
                   background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .terminal-box { border: 1px solid var(--green); padding: 25px; background: rgba(0,20,0,0.9); box-shadow: 0 0 15px var(--shadow); }
        
        .btn-link { background: var(--green); color: #000; border: none; padding: 15px 45px; 
                    font-weight: bold; cursor: pointer; font-family: inherit; margin-top: 15px; }
        
        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 15;
                     background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 255, 0, 0.02) 50%);
                     background-size: 100% 2px; pointer-events: none; }
    </style>
</head>
<body>

<video id="cam" autoplay playsinline muted webkit-playsinline></video>
<div class="scanlines"></div>
<canvas id="canvas"></canvas>

<div id="ui-boot">
    <div class="terminal-box">
        <h2 id="msg">TERMINAL V9.0 READY</h2>
        <p style="font-size: 10px; margin: 10px 0;">[SYSTEM::ORIENTATION_FIX_ACTIVE]</p>
        <button class="btn-link" onclick="start()">CONNECT LINK</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('cam');
    
    let state = { 
        p: 0, r: 0, h: 0, 
        smoothP: 0, smoothR: 0,
        alt: 1250, spd: 88, active: false 
    };

    function start() {
        // Камера
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(s => { video.srcObject = s; video.play(); })
            .catch(e => alert("NO CAM"));

        // Датчики (iOS 13+ Force)
        if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission().then(response => {
                if (response === 'granted') window.addEventListener('deviceorientation', updateSensors);
            });
        } else {
            window.addEventListener('deviceorientation', updateSensors);
        }

        document.getElementById('ui-boot').style.display = 'none';
        state.active = true;
        render();
    }

    function updateSensors(e) {
        // iOS берет beta для pitch и gamma для roll
        state.p = e.beta; 
        state.r = e.gamma;
        state.h = e.webkitCompassHeading || e.alpha || 0;
    }

    function drawHorizon() {
        const w = canvas.width, h = canvas.height;
        const cx = w / 2, cy = h / 2;

        // Сглаживание (LERP) для устранения тряски
        state.smoothP += (state.p - state.smoothP) * 0.15;
        state.smoothR += (state.r - state.smoothR) * 0.15;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(state.smoothR * Math.PI / 180);

        // Расчет вертикального смещения: 12 пикселей на 1 градус тангажа
        const pitchSpacing = 12;
        let pitchY = state.smoothP * pitchSpacing;

        // Рисуем область земли (заполнение ниже горизонта)
        ctx.fillStyle = "rgba(0, 255, 0, 0.1)";
        ctx.beginPath();
        ctx.moveTo(-w*2, pitchY);
        ctx.lineTo(w*2, pitchY);
        ctx.lineTo(w*2, h*2);
        ctx.lineTo(-w*2, h*2);
        ctx.fill();

        // Главная линия горизонта
        ctx.strokeStyle = varColor('--green');
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-250, pitchY); ctx.lineTo(-60, pitchY);
        ctx.moveTo(60, pitchY); ctx.lineTo(250, pitchY);
        ctx.stroke();

        // Штрихи тангажа (лестница)
        ctx.lineWidth = 1;
        ctx.font = "10px monospace";
        for (let i = -90; i <= 90; i += 10) {
            if (i === 0) continue;
            let y = pitchY - (i * pitchSpacing);
            let lineW = (Math.abs(i) % 20 === 0) ? 60 : 30;
            
            ctx.globalAlpha = Math.max(0, 1 - Math.abs(state.smoothP - i) / 40);
            ctx.beginPath();
            ctx.moveTo(-lineW, y); ctx.lineTo(lineW, y);
            ctx.stroke();
            ctx.fillText(i, lineW + 5, y + 4);
            ctx.fillText(i, -lineW - 20, y + 4);
        }
        ctx.restore();
        ctx.globalAlpha = 1;
    }

    function drawTape(x, y, val, label, side) {
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = varColor('--green');
        ctx.strokeRect(side === 'L' ? -40 : 0, -150, 40, 300);
        ctx.clip(new Path2D(`M ${side === 'L' ? -40 : 0} -150 h 40 v 300 h -40 Z`));
        
        let start = Math.floor(val / 10) * 10 - 40;
        for (let i = start; i <= start + 80; i += 10) {
            let yPos = (val - i) * 6;
            ctx.beginPath();
            ctx.moveTo(side === 'L' ? -10 : 0, yPos);
            ctx.lineTo(side === 'L' ? 0 : 10, yPos);
            ctx.stroke();
            ctx.font = "10px monospace";
            ctx.fillText(i, side === 'L' ? -35 : 15, yPos + 4);
        }
        ctx.restore();
        
        // Плашка текущего значения
        ctx.fillStyle = "rgba(0,40,0,0.9)";
        ctx.fillRect(side === 'L' ? x-45 : x-5, y-15, 55, 30);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 14px monospace";
        ctx.fillText(Math.round(val), side === 'L' ? x-38 : x+8, y+6);
        ctx.fillStyle = varColor('--green');
        ctx.fillText(label, side === 'L' ? x-38 : x+5, y-160);
    }

    function varColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name); }

    function render() {
        const w = canvas.width = window.innerWidth;
        const h = canvas.height = window.innerHeight;
        ctx.clearRect(0, 0, w, h);

        if (!state.active) return;

        drawHorizon();
        drawTape(w/2 - 180, h/2, state.spd, "SPD", "L");
        drawTape(w/2 + 180, h/2, state.alt, "ALT", "R");

        // Прицел
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(w/2, h/2, 15, 0, Math.PI*2);
        ctx.moveTo(w/2-30, h/2); ctx.lineTo(w/2-15, h/2);
        ctx.moveTo(w/2+30, h/2); ctx.lineTo(w/2+15, h/2);
        ctx.stroke();

        // Компас
        ctx.fillStyle = "#fff";
        ctx.font = "bold 16px monospace";
        ctx.fillText(Math.round(state.h).toString().padStart(3, '0') + "°", w/2-25, 60);

        requestAnimationFrame(render);
    }
</script>
</body>
</html>
