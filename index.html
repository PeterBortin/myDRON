<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FPV HUD | REAL GYRO + COMPASS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', 'Courier', monospace;
        }

        #camVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: grayscale(0.65) brightness(0.58) contrast(1.45) sepia(0.2) hue-rotate(85deg);
        }

        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,20,0,0.12) 0px, rgba(0,20,0,0.12) 2px, transparent 2px, transparent 5px);
            pointer-events: none;
            z-index: 10;
        }

        #hudCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 5;
            pointer-events: none;
        }

        .status-panel {
            position: fixed;
            bottom: 12px;
            left: 12px;
            right: 12px;
            z-index: 20;
            background: rgba(0, 10, 0, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            border: 0.5px solid rgba(0,255,0,0.4);
            font-size: 9px;
            font-family: monospace;
            pointer-events: none;
            color: #0f0;
        }

        .status-left {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .permission-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.96);
            backdrop-filter: blur(12px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 24px;
            font-family: monospace;
            color: #0f0;
            text-align: center;
            padding: 20px;
            transition: opacity 0.4s ease;
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 2px solid #0f0;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .permission-text {
            font-size: 13px;
            max-width: 280px;
            border-left: 2px solid #0f0;
            padding-left: 16px;
            text-align: left;
        }

        @media (max-width: 600px) {
            .status-panel { font-size: 7px; padding: 6px 12px; bottom: 8px; left: 8px; right: 8px; }
            .status-left { gap: 8px; }
        }
    </style>
</head>
<body>

<video id="camVideo" autoplay playsinline muted></video>
<div class="crt-overlay"></div>
<canvas id="hudCanvas"></canvas>
<div class="status-panel">
    <div class="status-left">
        <span>🔄 GYRO: <span id="gyroStatus">⏳</span></span>
        <span>🧭 COMPASS: <span id="compassStatus">⏳</span></span>
        <span>📷 CAM: <span id="camStatus">⏳</span></span>
    </div>
    <div>🎯 REAL SENSORS</div>
</div>
<div class="permission-overlay" id="permissionOverlay">
    <div class="loader"></div>
    <div class="permission-text">
        🔐 ТРЕБУЮТСЯ РАЗРЕШЕНИЯ:<br>
        • Движение/гироскоп (тангаж/крен)<br>
        • Геолокация (компас/направление)<br>
        • Камера (FPV вид)
    </div>
    <div style="font-size: 10px; opacity:0.7;">FPV TACTICAL HUD | РЕАЛЬНЫЕ ДАННЫЕ</div>
</div>

<script>
    (function(){
        // Элементы DOM
        const canvas = document.getElementById('hudCanvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('camVideo');
        const permissionOverlay = document.getElementById('permissionOverlay');
        const gyroStatusSpan = document.getElementById('gyroStatus');
        const compassStatusSpan = document.getElementById('compassStatus');
        const camStatusSpan = document.getElementById('camStatus');
        
        let width, height;
        let frame = 0;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();
        
        // ========== РЕАЛЬНЫЕ ДАННЫЕ С ДАТЧИКОВ ==========
        let pitch = 0;      // тангаж (наклон вперёд/назад) - из гироскопа
        let roll = 0;       // крен (наклон влево/вправо) - из гироскопа
        let heading = 0;    // направление (азимут) - из компаса/геолокации
        
        let gyroActive = false;
        let compassActive = false;
        let cameraActive = false;
        
        // Калибровка гироскопа (обнуляем положение при старте)
        let calibrationPitch = null;
        let calibrationRoll = null;
        
        // Телеметрия (реагирует на реальные наклоны)
        let speed = 110;
        let altitude = 2500;
        let battery = 25.4;
        let rssi = 88;
        
        // ========== 1. ГИРОСКОП (тангаж и крен) ==========
        function onDeviceOrientation(event) {
            if (!gyroActive) return;
            
            let beta = event.beta;    // тангаж -180..180
            let gamma = event.gamma;  // крен -90..90
            
            if (beta === null || gamma === null) return;
            
            // Калибровка при первом получении
            if (calibrationPitch === null) {
                calibrationPitch = beta;
                calibrationRoll = gamma;
                console.log("Gyro calibrated: pitch offset=" + calibrationPitch + ", roll offset=" + calibrationRoll);
            }
            
            // РЕАЛЬНЫЕ углы относительно калибровки (без фильтров)
            pitch = beta - calibrationPitch;
            roll = gamma - calibrationRoll;
            
            // Ограничиваем для корректного отображения
            pitch = Math.min(40, Math.max(-40, pitch));
            roll = Math.min(50, Math.max(-50, roll));
            
            // Влияние на телеметрию (наклон вперёд = ускорение)
            let pitchEffect = pitch / 18;
            speed += pitchEffect * 0.55;
            speed = Math.min(480, Math.max(15, speed));
            
            // Влияние на высоту
            let altEffect = (Math.abs(roll) * 0.12) - (pitch * 0.08);
            altitude += altEffect * 0.6;
            altitude = Math.min(13000, Math.max(150, altitude));
            
            // Батарея и сигнал
            battery += (Math.random() - 0.5) * 0.008;
            battery = Math.min(28.2, Math.max(21.8, battery));
            rssi += (Math.random() - 0.5) * 0.25;
            rssi = Math.min(99, Math.max(42, rssi));
        }
        
        // ========== 2. КОМПАС (направление/азимут) через Geolocation ==========
        // На Android 13+ для получения альфа (рыскания) нужно разрешение на геолокацию
        function initCompass() {
            if ('geolocation' in navigator) {
                // Запрашиваем геолокацию для получения направления
                navigator.geolocation.watchPosition(
                    (position) => {
                        if (position.coords.heading !== null) {
                            // heading - это направление движения (0=север, 90=восток)
                            heading = position.coords.heading;
                            compassActive = true;
                            compassStatusSpan.innerText = "OK";
                            compassStatusSpan.style.color = "#0f0";
                            console.log("Compass heading: " + heading);
                        } else {
                            // Если heading нет, пробуем deviceorientation alpha
                            compassStatusSpan.innerText = "NO DATA";
                        }
                    },
                    (error) => {
                        console.warn("Geolocation error:", error);
                        compassStatusSpan.innerText = "DENIED";
                        compassStatusSpan.style.color = "#f66";
                        // Fallback: пробуем альфа из deviceorientation
                        fallbackToAlpha();
                    },
                    {
                        enableHighAccuracy: true,
                        maximumAge: 0,
                        timeout: 5000
                    }
                );
            } else {
                compassStatusSpan.innerText = "NOT SUPPORT";
                fallbackToAlpha();
            }
        }
        
        // Fallback: используем альфа (рыскание) из deviceorientation
        function fallbackToAlpha() {
            let alphaHandler = (event) => {
                if (event.alpha !== null && !compassActive) {
                    heading = event.alpha;
                    compassActive = true;
                    compassStatusSpan.innerText = "ALPHA";
                    compassStatusSpan.style.color = "#fa0";
                }
            };
            window.addEventListener('deviceorientation', alphaHandler);
        }
        
        // ========== 3. ГИРОСКОП С ПОДДЕРЖКОЙ iOS И ANDROID ==========
        function initGyro() {
            if (typeof DeviceOrientationEvent !== 'undefined') {
                // iOS требует явного разрешения
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    // iOS: показываем системный диалог
                    DeviceOrientationEvent.requestPermission()
                        .then(permission => {
                            if (permission === 'granted') {
                                window.addEventListener('deviceorientation', onDeviceOrientation);
                                gyroActive = true;
                                gyroStatusSpan.innerText = "ACTIVE";
                                gyroStatusSpan.style.color = "#0f0";
                                console.log("Gyro active (iOS)");
                            } else {
                                gyroStatusSpan.innerText = "DENIED";
                                gyroStatusSpan.style.color = "#f66";
                                enableDemoMode();
                            }
                        })
                        .catch(err => {
                            console.error("Gyro permission error:", err);
                            gyroStatusSpan.innerText = "ERROR";
                            enableDemoMode();
                        });
                } else {
                    // Android / десктоп: подключаем сразу без запроса
                    window.addEventListener('deviceorientation', onDeviceOrientation);
                    gyroActive = true;
                    gyroStatusSpan.innerText = "ACTIVE";
                    gyroStatusSpan.style.color = "#0f0";
                    console.log("Gyro active (Android)");
                }
            } else {
                gyroStatusSpan.innerText = "NOT SUPPORT";
                enableDemoMode();
            }
        }
        
        // ========== 4. КАМЕРА ==========
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: "environment" } }
                });
                video.srcObject = stream;
                video.style.display = 'block';
                cameraActive = true;
                camStatusSpan.innerText = "ON";
                camStatusSpan.style.color = "#0f0";
            } catch(e) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                    video.style.display = 'block';
                    cameraActive = true;
                    camStatusSpan.innerText = "ON";
                    camStatusSpan.style.color = "#0f0";
                } catch(err) {
                    cameraActive = false;
                    camStatusSpan.innerText = "OFF";
                    camStatusSpan.style.color = "#f66";
                }
            }
        }
        
        // ========== ДЕМО-РЕЖИМ (только если реальные датчики недоступны) ==========
        let demoMode = false;
        function enableDemoMode() {
            demoMode = true;
            console.log("Demo mode active - using simulated data");
        }
        
        function updateDemo() {
            if (!demoMode) return;
            pitch = Math.sin(Date.now() * 0.002) * 10;
            roll = Math.cos(Date.now() * 0.0025) * 7;
            heading = (Date.now() * 0.03) % 360;
            speed += (Math.random() - 0.5) * 0.4;
            altitude += (Math.random() - 0.5) * 1.2;
        }
        
        // ========== ОТРИСОВКА HUD ==========
        function drawAttitude() {
            ctx.font = "bold 14px 'Courier New'";
            ctx.fillStyle = "#0f0";
            ctx.fillText(`PITCH ${pitch.toFixed(1)}°`, 18, 48);
            ctx.fillText(`ROLL ${roll.toFixed(1)}°`, 18, 78);
            
            // Отображаем реальный компас (азимут)
            let compassDirection = "";
            if (heading >= 337.5 || heading < 22.5) compassDirection = "N";
            else if (heading >= 22.5 && heading < 67.5) compassDirection = "NE";
            else if (heading >= 67.5 && heading < 112.5) compassDirection = "E";
            else if (heading >= 112.5 && heading < 157.5) compassDirection = "SE";
            else if (heading >= 157.5 && heading < 202.5) compassDirection = "S";
            else if (heading >= 202.5 && heading < 247.5) compassDirection = "SW";
            else if (heading >= 247.5 && heading < 292.5) compassDirection = "W";
            else if (heading >= 292.5 && heading < 337.5) compassDirection = "NW";
            
            ctx.fillText(`HEADING ${Math.floor(heading)}° ${compassDirection}`, 18, 108);
            ctx.fillText(`BAT ${battery.toFixed(1)}V`, 18, 138);
            
            ctx.fillStyle = `rgba(0,255,0,0.7)`;
            ctx.fillRect(18, 152, (rssi/100)*70, 7);
            ctx.strokeStyle = "#0f0";
            ctx.strokeRect(18, 152, 70, 7);
            ctx.fillStyle = "#0f0";
            ctx.fillText(`RSSI ${Math.floor(rssi)}%`, 18, 174);
        }
        
        function drawCompass() {
            let cx = width - 85;
            let cy = 80;
            let r = 55;
            
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI*2);
            ctx.strokeStyle = "#0f0";
            ctx.stroke();
            
            // Рисуем метки компаса (N, E, S, W)
            let directions = [
                { deg: 0, label: "N", offset: 0 },
                { deg: 45, label: "NE", offset: 0 },
                { deg: 90, label: "E", offset: 0 },
                { deg: 135, label: "SE", offset: 0 },
                { deg: 180, label: "S", offset: 0 },
                { deg: 225, label: "SW", offset: 0 },
                { deg: 270, label: "W", offset: 0 },
                { deg: 315, label: "NW", offset: 0 }
            ];
            
            for(let d of directions) {
                // Поворачиваем метку относительно текущего курса
                let angle = (d.deg - heading) * Math.PI / 180;
                let x = cx + Math.sin(angle) * (r - 12);
                let y = cy - Math.cos(angle) * (r - 12);
                ctx.fillStyle = "#0f0";
                ctx.font = (d.label === "N") ? "bold 14px monospace" : "11px monospace";
                ctx.fillText(d.label, x-6, y+5);
            }
            
            // Стрелка направления (всегда показывает на север относительно курса)
            ctx.beginPath();
            let arrowAngle = (0 - heading) * Math.PI / 180;
            let arrowX = cx + Math.sin(arrowAngle) * (r - 8);
            let arrowY = cy - Math.cos(arrowAngle) * (r - 8);
            ctx.moveTo(arrowX, arrowY);
            ctx.lineTo(arrowX - 5, arrowY - 10);
            ctx.lineTo(arrowX + 5, arrowY - 10);
            ctx.fillStyle = "#fa0";
            ctx.fill();
            
            // Центральная точка
            ctx.beginPath();
            ctx.arc(cx, cy, 4, 0, Math.PI*2);
            ctx.fillStyle = "#0f0";
            ctx.fill();
            
            // Текст текущего курса
            ctx.font = "bold 10px monospace";
            ctx.fillStyle = "#0f0";
            ctx.fillText(`${Math.floor(heading)}°`, cx-15, cy+r+12);
        }
        
        function drawTape(x, y, value, label, unit, alignRight) {
            ctx.font = "bold 11px monospace";
            ctx.fillStyle = "#0f0";
            ctx.fillText(label, alignRight ? x-40 : x+5, y-38);
            let step = 20;
            let startVal = Math.floor(value/step)*step - 60;
            for(let v = startVal; v <= startVal+120; v+= step){
                let ty = y + (value - v)*1.25;
                if(ty > 30 && ty < height-30){
                    ctx.beginPath();
                    ctx.moveTo(alignRight ? x-16 : x+16, ty);
                    ctx.lineTo(alignRight ? x : x+26, ty);
                    ctx.stroke();
                    ctx.fillText(Math.floor(v), alignRight ? x-38 : x+22, ty+4);
                }
            }
            ctx.fillStyle = "rgba(0,255,0,0.2)";
            ctx.fillRect(alignRight ? x-38 : x, y-9, 32, 18);
            ctx.fillStyle = "#0f0";
            ctx.font = "bold 18px monospace";
            ctx.fillText(Math.floor(value), alignRight ? x-28 : x+7, y+6);
            ctx.font = "8px monospace";
            ctx.fillText(unit, alignRight ? x-10 : x+35, y+4);
        }
        
        function drawHorizon() {
            ctx.save();
            ctx.translate(width/2, height/2 + 20);
            ctx.rotate(roll * Math.PI / 180);
            let pitchOffset = pitch * 2.2;
            
            ctx.beginPath();
            ctx.moveTo(-300, pitchOffset);
            ctx.lineTo(300, pitchOffset);
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#0f0";
            ctx.stroke();
            
            for(let ang = -30; ang <= 30; ang += 10) {
                let yOff = ang * 1.6 + pitchOffset;
                if(Math.abs(yOff) < 160) {
                    ctx.beginPath();
                    ctx.moveTo(ang===0 ? -55 : -30, yOff);
                    ctx.lineTo(ang===0 ? 55 : 30, yOff);
                    ctx.stroke();
                    ctx.fillStyle = "#0f0";
                    ctx.font = "9px monospace";
                    ctx.fillText(ang+"°", 62, yOff+4);
                    ctx.fillText(ang+"°", -80, yOff+4);
                }
            }
            ctx.restore();
            
            // Прицельная метка
            ctx.beginPath();
            ctx.moveTo(width/2 - 15, height/2 + 18);
            ctx.lineTo(width/2 - 4, height/2 + 18);
            ctx.moveTo(width/2 + 4, height/2 + 18);
            ctx.lineTo(width/2 + 15, height/2 + 18);
            ctx.moveTo(width/2, height/2 + 8);
            ctx.lineTo(width/2, height/2 + 28);
            ctx.stroke();
        }
        
        function drawBottom() {
            let time = new Date().toLocaleTimeString();
            ctx.font = "8px monospace";
            ctx.fillStyle = "#0f0";
            ctx.fillText(`${time} | ALT ${Math.floor(altitude)}m | SPD ${Math.floor(speed)}km/h`, 16, height-12);
            
            if(gyroActive && compassActive) {
                ctx.fillText("✅ REAL SENSORS", width-105, height-12);
            } else if(demoMode) {
                ctx.fillText("⚠️ DEMO MODE", width-85, height-12);
            }
        }
        
        function drawScanline() {
            ctx.fillStyle = 'rgba(0,255,0,0.03)';
            ctx.fillRect(0, (frame * 2.5) % height, width, 3);
        }
        
        // ========== АНИМАЦИЯ ==========
        function animate() {
            frame++;
            
            if(demoMode) {
                updateDemo();
            }
            
            ctx.clearRect(0, 0, width, height);
            drawHorizon();
            drawTape(width * 0.09, height/2, speed, "SPD", "km/h", false);
            drawTape(width * 0.91, height/2, altitude, "ALT", "m", true);
            drawAttitude();
            drawCompass();
            drawBottom();
            drawScanline();
            
            requestAnimationFrame(animate);
        }
        
        // ========== ЗАПУСК С АВТОМАТИЧЕСКИМИ ЗАПРОСАМИ ==========
        async function start() {
            // Запрашиваем все разрешения последовательно
            await initCamera();
            initGyro();
            initCompass();  // Запрашивает геолокацию для компаса
            
            // Скрываем оверлей через 2 секунды (даём время на запросы)
            setTimeout(() => {
                if(permissionOverlay) {
                    permissionOverlay.style.opacity = "0";
                    setTimeout(() => {
                        permissionOverlay.style.display = "none";
                    }, 500);
                }
            }, 2000);
            
            // Если через 3 секунды гироскоп не активен - включаем демо
            setTimeout(() => {
                if(!gyroActive && !demoMode) {
                    enableDemoMode();
                    gyroStatusSpan.innerText = "DEMO";
                    gyroStatusSpan.style.color = "#fa0";
                }
                if(!compassActive) {
                    compassStatusSpan.innerText = "DEMO";
                    compassStatusSpan.style.color = "#fa0";
                    if(!demoMode) heading = (Date.now() * 0.03) % 360;
                }
            }, 3000);
        }
        
        start();
        animate();
        resize();
        
        console.log("FPV HUD Started - waiting for sensor permissions");
    })();
</script>
</body>
</html>
