<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>myDRON Tactical OS</title>
    <style>
        :root { --main-color: #00ff00; --alert-color: #ff0000; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        
        /* Загрузочный экран */
        #loader {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--main-color);
        }
        .logo { font-size: 40px; font-weight: bold; letter-spacing: 15px; margin-bottom: 20px; animation: pulse 1.5s infinite; }
        .progress-bar { width: 200px; height: 4px; border: 1px solid var(--main-color); position: relative; }
        .progress-fill { width: 0%; height: 100%; background: var(--main-color); transition: width 0.1s linear; }
        @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

        /* HUD Элементы */
        #cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.4; filter: grayscale(1) brightness(0.7) contrast(1.5); z-index: 1; }
        #hudCanvas { position: relative; z-index: 5; display: block; filter: drop-shadow(0 0 2px var(--main-color)); }
        .crt { position: fixed; inset: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%), linear-gradient(90deg, rgba(255,0,0,0.05), rgba(0,255,0,0.02), rgba(0,0,255,0.05)); background-size: 100% 3px, 3px 100%; pointer-events: none; z-index: 10; }

        .btn-launch {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 30, 0, 0.8); color: var(--main-color); border: 2px solid var(--main-color);
            padding: 15px 40px; font-size: 18px; font-weight: bold; cursor: pointer; z-index: 20;
            text-transform: uppercase; letter-spacing: 5px; box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }
        .btn-launch:active { background: var(--main-color); color: #000; }
    </style>
</head>
<body>

<div id="loader">
    <div class="logo">myDRON</div>
    <div style="font-size: 10px; margin-bottom: 10px;">CONNECTING TO SAT_LINK...</div>
    <div class="progress-bar"><div id="fill" class="progress-fill"></div></div>
</div>

<video id="cam" autoplay playsinline></video>
<div class="crt"></div>
<canvas id="hudCanvas"></canvas>

<button class="btn-launch" onclick="launchSystem()">Запуск</button>

<script>
    const canvas = document.getElementById('hudCanvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('cam');
    let width, height, frame = 0;
    let pitch = 0, roll = 0, yaw = 0; // x, y, rotation
    let combatMode = false;
    let targets = [];

    // 1. Анимация загрузки
    let prg = 0;
    const interval = setInterval(() => {
        prg += Math.random() * 5;
        document.getElementById('fill').style.width = Math.min(prg, 100) + '%';
        if(prg >= 100) {
            clearInterval(interval);
            setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
        }
    }, 100);

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 2. Инициализация сенсоров
    async function launchSystem() {
        combatMode = true;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
        } catch(e) { console.error("Camera error"); }

        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            const res = await DeviceOrientationEvent.requestPermission();
            if (res === 'granted') window.addEventListener('deviceorientation', e => {
                yaw = e.alpha;   // Направление (X)
                pitch = e.beta;  // Наклон (Y)
                roll = e.gamma;
            });
        } else {
            window.addEventListener('deviceorientation', e => { yaw = e.alpha; pitch = e.beta; roll = e.gamma; });
        }
        
        // Генерация случайных "целей" для демо автозахвата
        targets = Array.from({length: 3}, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            id: Math.floor(Math.random() * 999)
        }));
    }

    function drawTape(x, y, val, label, alignRight = false) {
        const h = 250, w = 60;
        ctx.strokeStyle = varColor();
        ctx.strokeRect(x, y - h/2, w, h);
        ctx.save();
        ctx.rect(x, y - h/2, w, h);
        ctx.clip();
        
        for(let i = -10; i <= 10; i++) {
            let currVal = Math.round(val + i * 10);
            let ty = y - (i * 30);
            ctx.beginPath();
            ctx.moveTo(alignRight ? x : x + w, ty);
            ctx.lineTo(alignRight ? x + 15 : x + w - 15, ty);
            ctx.stroke();
            ctx.font = '10px monospace';
            ctx.fillStyle = varColor();
            ctx.fillText(currVal, alignRight ? x + 20 : x + 5, ty + 5);
        }
        ctx.restore();
        ctx.fillText(label, x, y - h/2 - 10);
    }

    function varColor() { return combatMode ? '#ff0000' : '#00ff00'; }

    function drawCombatHUD() {
        if(!combatMode) return;
        
        targets.forEach(t => {
            // Анимация захвата
            let size = 40 + Math.sin(frame * 0.1) * 5;
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 1;
            
            // Рамка захвата
            ctx.strokeRect(t.x - size/2, t.y - size/2, size, size);
            ctx.beginPath();
            ctx.moveTo(t.x, t.y - size); ctx.lineTo(t.x, t.y - size/2);
            ctx.stroke();
            
            ctx.font = '10px monospace';
            ctx.fillText(`TRGT_${t.id}`, t.x + size/2 + 5, t.y);
            ctx.fillText(`DIST: ${(Math.abs(pitch) * 10).toFixed(0)}m`, t.x + size/2 + 5, t.y + 12);
            
            // Линия от центра
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(width/2, height/2);
            ctx.lineTo(t.x, t.y);
            ctx.stroke();
            ctx.setLineDash([]);
        });
    }

    function loop() {
        frame++;
        ctx.clearRect(0, 0, width, height);

        // Сетка
        ctx.strokeStyle = 'rgba(0, 255, 0, 0.1)';
        for(let i=0; i<width; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,height); ctx.stroke(); }

        // Барабаны: Левый (X - направление), Правый (Y - наклон)
        drawTape(width * 0.1, height/2, yaw || 0, "AZIMUTH (X)");
        drawTape(width * 0.85, height/2, pitch || 0, "PITCH (Y)", true);

        // Центральный прицел
        ctx.strokeStyle = varColor();
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(width/2, height/2, 20, 0, Math.PI*2);
        ctx.moveTo(width/2 - 40, height/2); ctx.lineTo(width/2 - 10, height/2);
        ctx.moveTo(width/2 + 40, height/2); ctx.lineTo(width/2 + 10, height/2);
        ctx.stroke();

        drawCombatHUD();

        // Текст системы
        ctx.fillStyle = varColor();
        ctx.font = '12px monospace';
        ctx.fillText(`SYSTEM: ${combatMode ? 'COMBAT_ACTIVE' : 'STANDBY'}`, 20, 30);
        ctx.fillText(`COORDS: ${yaw.toFixed(2)} / ${pitch.toFixed(2)}`, 20, 45);

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
