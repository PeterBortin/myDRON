<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DRONE PFD v8.1 — FIXED</title>
    <style>
        :root { --color: #00ff41; }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: var(--color); }
        
        #cam { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; 
               filter: brightness(0.65) contrast(1.45) sepia(0.25) hue-rotate(88deg); }
        
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 15;
                     background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,255,0,0.05) 50%),
                                 linear-gradient(90deg, rgba(255,0,0,0.02), rgba(0,255,0,0.01), rgba(0,0,255,0.02));
                     background-size: 100% 4px, 3px 100%; pointer-events: none; }
        
        .status-bar {
            position: fixed; top: 12px; left: 20px; z-index: 200; font-size: 13px;
            text-shadow: 0 0 8px var(--color);
        }
        
        #info { 
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); padding: 8px 16px; border: 1px solid var(--color);
            font-size: 12px; z-index: 200; display: none;
        }
    </style>
</head>
<body>

<video id="cam" autoplay playsinline muted webkit-playsinline></video>
<div class="scanlines"></div>
<canvas id="canvas"></canvas>

<div class="status-bar" id="status-bar">ОЖИДАНИЕ ДАННЫХ...</div>
<div id="info">ГИРОСКОП НЕ АКТИВЕН</div>

<button id="reset-btn" style="position:fixed;bottom:30px;right:30px;z-index:200;background:rgba(0,255,65,0.1);border:1px solid #0f0;color:#0f0;padding:12px 20px;font-size:13px;cursor:pointer;display:none;" onclick="resetHorizon()">
    ЦЕНТР ГОРИЗОНТА
</button>

<div id="boot" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:300;background:rgba(0,0,0,0.95);display:flex;align-items:center;justify-content:center;">
    <div style="background:#000;border:1px solid #0f0;padding:40px 30px;text-align:center;max-width:90%;">
        <h1 style="font-size:24px;letter-spacing:3px;">DRONE PFD v8.1</h1>
        <p style="margin:15px 0 25px;font-size:13px;">Полноценный авиационный интерфейс для iPhone 15</p>
        <button onclick="boot()" style="background:#0f0;color:#000;border:none;padding:16px 50px;font-weight:bold;font-size:15px;cursor:pointer;">ЗАПУСТИТЬ СИСТЕМУ</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('cam');
    const statusBar = document.getElementById('status-bar');
    const info = document.getElementById('info');

    let state = {
        pitch: 0, roll: 0,          // сглаженные
        rawPitch: 0, rawRoll: 0,
        offsetPitch: 0, offsetRoll: 0,
        heading: 0,
        speed: 0, altitude: 0, vsi: 0,
        battery: 100,
        active: false,
        frame: 0,
        gyroWorks: false
    };

    async function requestSensorsPermission() {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
                const orient = await DeviceOrientationEvent.requestPermission();
                console.log('Orientation permission:', orient);
            } catch (e) { console.warn(e); }
        }
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
            try {
                const motion = await DeviceMotionEvent.requestPermission();
                console.log('Motion permission:', motion);
            } catch (e) { console.warn(e); }
        }
    }

    function boot() {
        document.getElementById('boot').style.display = 'none';
        document.getElementById('reset-btn').style.display = 'block';

        // Камера
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; video.play(); })
            .catch(err => console.error("Camera error:", err));

        // Разрешения + слушатели
        requestSensorsPermission().then(() => {
            window.addEventListener('deviceorientation', handleOrientation);
            window.addEventListener('devicemotion', handleMotion);
        });

        state.active = true;
        animate();
        setInterval(updateStatus, 1000);
    }

    function handleOrientation(e) {
        if (!e) return;
        state.gyroWorks = true;
        info.style.display = 'none';

        // На iPhone: beta = тангаж (pitch), gamma = крен (roll)
        state.rawPitch = e.beta || 0;
        state.rawRoll  = e.gamma || 0;
        if (e.webkitCompassHeading !== null) state.heading = e.webkitCompassHeading;
    }

    function handleMotion(e) {
        if (!e.rotationRate) return;
        state.gyroWorks = true;
        info.style.display = 'none';
        
        // Дополнительная информация из rotationRate (более стабильная на некоторых iOS)
        const rate = e.rotationRate;
        if (rate.beta !== null) state.rawPitch = (state.rawPitch + rate.beta * 0.3) / 1.3; // лёгкое сглаживание
        if (rate.gamma !== null) state.rawRoll  = (state.rawRoll + rate.gamma * 0.3) / 1.3;
    }

    function resetHorizon() {
        state.offsetPitch = state.rawPitch;
        state.offsetRoll  = state.rawRoll;
        if (navigator.vibrate) navigator.vibrate(60);
    }

    function updateStatus() {
        statusBar.innerHTML = `BATT ${state.battery}% &nbsp; ${state.gyroWorks ? '✅ ГИРО АКТИВЕН' : '⚠️ ГИРО НЕ РАБОТАЕТ'} &nbsp; HDG ${Math.round(state.heading).toString().padStart(3,'0')}°`;
        
        if (!state.gyroWorks) {
            info.style.display = 'block';
            info.textContent = 'ГИРОСКОП НЕ ОТВЕЧАЕТ. Попробуйте перезагрузить страницу или проверить разрешения в Настройках → Safari → Движение и ориентация';
        }
    }

    function drawHorizon() {
        const w = canvas.width, h = canvas.height;
        const cx = w/2, cy = h/2;

        // Сглаживание
        state.pitch = state.pitch * 0.85 + ((state.rawPitch - state.offsetPitch) * 0.15);
        state.roll  = state.roll  * 0.85 + ((state.rawRoll  - state.offsetRoll)  * 0.15);

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(state.roll * Math.PI / 180);

        const pitchOffset = state.pitch * 8.5; // чувствительность

        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 3.5;
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#0f0';

        // Горизонт
        ctx.beginPath();
        ctx.moveTo(-300, pitchOffset);
        ctx.lineTo(300, pitchOffset);
        ctx.stroke();

        // Шкала тангажа
        ctx.lineWidth = 2;
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'center';

        for (let i = -60; i <= 60; i += 5) {
            if (i === 0) continue;
            const y = pitchOffset - i * 8.5;
            if (Math.abs(y) > h * 0.6) continue;

            ctx.setLineDash(i % 10 === 0 ? [] : [4, 3]);
            ctx.beginPath();
            ctx.moveTo(-55, y);
            ctx.lineTo(55, y);
            ctx.stroke();

            if (i % 10 === 0) {
                ctx.fillStyle = '#0f0';
                ctx.fillText(i, 78, y + 5);
                ctx.fillText(i, -78, y + 5);
            }
        }
        ctx.setLineDash([]);
        ctx.restore();
    }

    function drawRollIndicator() {
        const cx = canvas.width / 2;
        const cy = canvas.height / 2 - 20; // чуть выше центра
        const r = 135;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#0f0';

        // Дуга крена
        ctx.beginPath();
        ctx.arc(0, 0, r, -Math.PI * 0.65, Math.PI * 0.65);
        ctx.stroke();

        // Метки
        const marks = [-60,-45,-30,-20,-10,0,10,20,30,45,60];
        ctx.font = 'bold 13px monospace';

        for (let ang of marks) {
            const rad = ang * Math.PI / 180 - Math.PI / 2;
            const x1 = Math.cos(rad) * r;
            const y1 = Math.sin(rad) * r;
            const len = Math.abs(ang) % 30 === 0 ? 28 : 16;
            const x2 = Math.cos(rad) * (r + len);
            const y2 = Math.sin(rad) * (r + len);

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            if (Math.abs(ang) % 30 === 0 || ang === 0) {
                ctx.fillText(Math.abs(ang), Math.cos(rad)*(r+42), Math.sin(rad)*(r+42) + 6);
            }
        }

        // Указатель текущего крена
        ctx.rotate(state.roll * Math.PI / 180);
        ctx.fillStyle = '#0f0';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.moveTo(0, -r - 18);
        ctx.lineTo(-14, -r + 10);
        ctx.lineTo(14, -r + 10);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    function drawTape(x, y, value, label, side, unit) {
        // (оставил почти как было, только чуть улучшил вид)
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 2.5;

        ctx.strokeRect(side === 'L' ? -45 : 0, -135, 45, 270);

        const start = Math.floor(value / 10) * 10 - 40;
        for (let i = start; i < start + 90; i += 10) {
            const pos = (value - i) * 7;
            ctx.beginPath();
            ctx.moveTo(side === 'L' ? -15 : 0, pos);
            ctx.lineTo(side === 'L' ? 0 : 15, pos);
            ctx.stroke();

            ctx.font = '11px monospace';
            ctx.fillText(i, side === 'L' ? -32 : 22, pos + 4);
        }
        ctx.restore();

        // Цифровое значение
        ctx.fillStyle = '#0f0';
        ctx.font = 'bold 22px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(Math.round(value), side === 'L' ? x - 28 : x + 22, y + 10);

        ctx.font = '9px monospace';
        ctx.fillText(label + " " + unit, side === 'L' ? x - 28 : x + 22, y - 148);
    }

    function animate() {
        if (!state.active) return;
        state.frame++;

        const w = canvas.width = window.innerWidth;
        const h = canvas.height = window.innerHeight;
        ctx.clearRect(0, 0, w, h);

        drawHorizon();
        drawRollIndicator();

        // Примерные значения (можно заменить на реальные с GPS)
        state.speed = 45 + Math.sin(state.frame/80) * 8;
        state.altitude = 1250 + Math.cos(state.frame/120) * 120;
        state.vsi = Math.sin(state.frame/40) * 450;

        drawTape(125, h/2, state.speed, "GS", "L", "KT");
        drawTape(w - 125, h/2, state.altitude, "ALT", "R", "FT");

        // Прицел
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 2.5;
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(w/2, h/2, 16, 0, Math.PI*2);
        ctx.moveTo(w/2-38, h/2); ctx.lineTo(w/2-16, h/2);
        ctx.moveTo(w/2+38, h/2); ctx.lineTo(w/2+16, h/2);
        ctx.stroke();

        ctx.font = 'bold 19px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`HDG ${Math.round(state.heading).toString().padStart(3,'0')}°`, w/2, 72);

        requestAnimationFrame(animate);
    }

    // Запуск при загрузке
    window.addEventListener('load', () => {
        console.log('%cDRONE PFD v8.1 — FIXED VERSION загружена', 'color:#0f0;font-family:monospace');
    });
</script>
</body>
</html>
