<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FPV HUD PRO | IOS FIXED</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #000; overflow: hidden; font-family: monospace; }
        
        /* Видео для iOS должно быть фиксированным */
        #camVideo {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
            filter: grayscale(0.4) brightness(0.8) contrast(1.2) sepia(0.1) hue-rotate(80deg);
        }

        #hudCanvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none;
        }

        /* Кнопка запуска — КРИТИЧНО ДЛЯ IOS */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #0f0;
            text-align: center;
        }

        .btn {
            border: 2px solid #0f0;
            background: transparent;
            color: #0f0;
            padding: 20px 40px;
            font-size: 18px;
            font-family: monospace;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
        }

        .status {
            position: fixed;
            bottom: 20px; left: 20px;
            z-index: 20; color: #0f0; font-size: 10px;
            background: rgba(0,20,0,0.6); padding: 5px;
        }
    </style>
</head>
<body>

<video id="camVideo" autoplay playsinline webkit-playsinline muted></video>
<canvas id="hudCanvas"></canvas>

<div id="status" class="status">SYSTEM: STANDBY</div>

<div id="overlay">
    <h2>FPV TERMINAL</h2>
    <p style="font-size: 12px; margin-top: 10px;">ТРЕБУЕТСЯ ПОДТВЕРЖДЕНИЕ ДАТЧИКОВ</p>
    <button class="btn" onclick="startSystem()">АКТИВИРОВАТЬ</button>
</div>

<script>
    const canvas = document.getElementById('hudCanvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('camVideo');
    const statusEl = document.getElementById('status');
    const overlay = document.getElementById('overlay');

    let telemetry = {
        pitch: 0, roll: 0, heading: 0, 
        alt: 150, spd: 45, batt: 25.2
    };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // КРИТИЧЕСКАЯ ФУНКЦИЯ ДЛЯ IOS
    async function startSystem() {
        statusEl.innerText = "SYSTEM: INITIALIZING...";
        
        // 1. Запрос камеры
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' },
                audio: false
            });
            video.srcObject = stream;
            await video.play();
        } catch (err) {
            console.error("Camera error:", err);
            statusEl.innerText = "CAM ERROR: " + err.name;
        }

        // 2. Запрос датчиков (Специфично для iOS 13+)
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
                const permission = await DeviceOrientationEvent.requestPermission();
                if (permission === 'granted') {
                    window.addEventListener('deviceorientation', handleMotion);
                } else {
                    statusEl.innerText = "GYRO: DENIED";
                }
            } catch (err) {
                statusEl.innerText = "GYRO ERROR";
            }
        } else {
            // Для Android и старых iOS
            window.addEventListener('deviceorientation', handleMotion);
        }

        overlay.style.display = 'none';
        animate();
    }

    function handleMotion(e) {
        // Правильное сопоставление осей для iOS
        telemetry.pitch = e.beta; // Наклон вперед/назад
        telemetry.roll = e.gamma;  // Крен влево/вправо
        if (e.webkitCompassHeading) {
            telemetry.heading = e.webkitCompassHeading;
        } else {
            telemetry.heading = e.alpha;
        }
    }

    function drawHUD() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;

        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = '#0f0';
        ctx.fillStyle = '#0f0';
        ctx.lineWidth = 2;

        // Анимированный "Горизонт"
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(telemetry.roll * Math.PI / 180);
        
        let pitchY = telemetry.pitch * 4;
        
        // Линии искусственного горизонта
        ctx.beginPath();
        ctx.moveTo(-100, pitchY); ctx.lineTo(-30, pitchY);
        ctx.moveTo(30, pitchY); ctx.lineTo(100, pitchY);
        ctx.stroke();

        // Шкала тангажа
        ctx.font = '10px monospace';
        for(let i = -30; i <= 30; i += 10) {
            let y = pitchY - (i * 4);
            ctx.globalAlpha = 0.3;
            ctx.beginPath();
            ctx.moveTo(-20, y); ctx.lineTo(20, y);
            ctx.stroke();
            ctx.fillText(i, 25, y + 4);
        }
        ctx.restore();

        // Рамки данных
        ctx.globalAlpha = 1;
        ctx.strokeRect(20, cy - 60, 40, 120); // SPD
        ctx.strokeRect(w - 60, cy - 60, 40, 120); // ALT

        ctx.font = 'bold 12px monospace';
        ctx.fillText("SPD", 25, cy - 70);
        ctx.fillText(Math.round(telemetry.spd), 28, cy + 5);
        
        ctx.fillText("ALT", w - 55, cy - 70);
        ctx.fillText(Math.round(telemetry.alt), w - 55, cy + 5);

        // Компас сверху
        ctx.beginPath();
        ctx.moveTo(cx - 50, 40); ctx.lineTo(cx + 50, 40);
        ctx.stroke();
        ctx.fillText("HDG: " + Math.round(telemetry.heading) + "°", cx - 30, 30);
    }

    function animate() {
        drawHUD();
        requestAnimationFrame(animate);
    }
</script>
</body>
</html>
