<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FPV Advanced HUD</title>
    <style>
        :root { --hud-color: #00ff00; --alert-color: #ff0000; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; }
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.3; filter: grayscale(1) contrast(1.5); z-index: 1; }

        .ui-panel {
            position: fixed; bottom: 30px; width: 100%; display: flex;
            justify-content: center; gap: 20px; z-index: 100;
        }

        .btn {
            background: rgba(0, 40, 0, 0.6); color: var(--hud-color);
            border: 1px solid var(--hud-color); padding: 15px 25px;
            text-transform: uppercase; font-size: 12px; font-weight: bold;
            letter-spacing: 2px; cursor: pointer; backdrop-filter: blur(5px);
        }

        #terminal {
            position: fixed; top: 20px; left: 20px; width: 250px; height: 150px;
            background: rgba(0, 20, 0, 0.8); border: 1px solid var(--hud-color);
            color: var(--hud-color); font-size: 10px; padding: 10px;
            overflow: hidden; z-index: 90; display: none;
        }

        #overlay {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--hud-color); text-align: center;
        }
    </style>
</head>
<body>

<div id="overlay">
    <h1 style="letter-spacing: 10px;">FPV SYSTEM v2.0</h1>
    <p>WAITING FOR NEURAL LINK...</p>
    <button class="btn" onclick="bootSystem()">CONNECT SENSORS</button>
</div>

<video id="cam" autoplay playsinline></video>
<canvas id="hud"></canvas>
<div id="terminal"></div>

<div class="ui-panel">
    <button class="btn" onclick="toggleTerminal()">Data</button>
    <button class="btn" onclick="toggleAlert()">Combat</button>
</div>

<script>
    const canvas = document.getElementById('hud');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('cam');
    const term = document.getElementById('terminal');

    let w, h;
    let roll = 0, pitch = 0, yaw = 0;
    let speed = 0, alt = 150;
    let isAlert = false;
    let frame = 0;

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function log(msg) {
        const line = document.createElement('div');
        line.textContent = `> ${msg}`;
        term.prepend(line);
    }

    async function bootSystem() {
        document.getElementById('overlay').style.display = 'none';
        
        // Камера
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            log("CAM LINK ESTABLISHED");
        } catch(e) { log("CAM ERROR: " + e.message); }

        // Датчики
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            const res = await DeviceOrientationEvent.requestPermission();
            if (res === 'granted') window.addEventListener('deviceorientation', updateSensors);
        } else {
            window.addEventListener('deviceorientation', updateSensors);
        }
        log("GYRO STABILIZED");
        requestAnimationFrame(loop);
    }

    function updateSensors(e) {
        // Оптимизация под альбомную ориентацию
        if (window.innerHeight < window.innerWidth) {
            roll = e.beta;
            pitch = -e.gamma - 30;
        } else {
            roll = e.gamma;
            pitch = e.beta - 60;
        }
    }

    function drawCrosshair() {
        ctx.save();
        ctx.translate(w/2, h/2);
        
        const gap = 20 + Math.abs(roll * 0.5); // Динамический зазор
        ctx.strokeStyle = isAlert ? '#ff0000' : '#00ff00';
        ctx.lineWidth = 2;

        // Центральные скобки (из твоего рефа)
        ctx.beginPath();
        // Левая скобка
        ctx.moveTo(-gap - 20, -15); ctx.lineTo(-gap, -15);
        ctx.moveTo(-gap - 20, 15); ctx.lineTo(-gap, 15);
        ctx.moveTo(-gap - 20, -15); ctx.lineTo(-gap - 20, 15);
        
        // Правая скобка
        ctx.moveTo(gap + 20, -15); ctx.lineTo(gap, -15);
        ctx.moveTo(gap + 20, 15); ctx.lineTo(gap, 15);
        ctx.moveTo(gap + 20, -15); ctx.lineTo(gap + 20, 15);
        
        // Центр
        ctx.moveTo(-10, 0); ctx.lineTo(-5, 0);
        ctx.moveTo(10, 0); ctx.lineTo(5, 0);
        ctx.stroke();
        ctx.restore();
    }

    function drawTapes() {
        ctx.font = '14px monospace';
        ctx.fillStyle = isAlert ? '#ff0000' : '#00ff00';
        
        // Скорость (лево)
        let sVal = 45 + Math.sin(frame * 0.01) * 5;
        ctx.strokeRect(40, h/2 - 100, 50, 200);
        ctx.fillText("SPD", 40, h/2 - 110);
        ctx.fillText(Math.round(sVal), 50, h/2);

        // Высота (право)
        ctx.strokeRect(w - 90, h/2 - 100, 50, 200);
        ctx.fillText("ALT", w - 90, h/2 - 110);
        ctx.fillText(Math.round(alt - pitch), w - 80, h/2);
    }

    function drawHorizon() {
        ctx.save();
        ctx.translate(w/2, h/2);
        ctx.rotate(roll * Math.PI / 180);
        ctx.translate(0, pitch * 5);

        ctx.strokeStyle = isAlert ? 'rgba(255,0,0,0.5)' : 'rgba(0,255,0,0.5)';
        ctx.beginPath();
        for(let i = -10; i <= 10; i++) {
            if(i === 0) {
                ctx.moveTo(-150, 0); ctx.lineTo(150, 0);
            } else {
                let y = i * 40;
                ctx.moveTo(-30, y); ctx.lineTo(30, y);
                ctx.fillText(i * 10, 40, y + 5);
            }
        }
        ctx.stroke();
        ctx.restore();
    }

    function loop() {
        frame++;
        ctx.clearRect(0, 0, w, h);

        // Эффект помех
        if (Math.random() > 0.98) {
            ctx.fillStyle = 'rgba(0,255,0,0.1)';
            ctx.fillRect(0, Math.random() * h, w, 2);
        }

        drawHorizon();
        drawCrosshair();
        drawTapes();

        // Статус бар
        ctx.fillText(`VOLT: 14.8V  RSSI: 99%  SAT: 12`, 20, h - 20);

        requestAnimationFrame(loop);
    }

    function toggleTerminal() { term.style.display = term.style.display === 'block' ? 'none' : 'block'; }
    function toggleAlert() { isAlert = !isAlert; log(isAlert ? "WEAPON ACTIVE" : "SCAN MODE"); }
</script>
</body>
</html>
