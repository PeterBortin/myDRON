<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FPV COMMAND CENTER v8.0 PRO</title>
    <style>
        :root { --color: #00ff41; --color-dim: rgba(0, 255, 65, 0.3); --bg: rgba(0, 10, 0, 0.8); }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; }
        body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: var(--color); }
        
        #cam { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; 
               filter: brightness(0.5) contrast(1.2) sepia(0.2) hue-rotate(85deg) blur(0.5px); }
        
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        /* ЭКРАН ЗАГРУЗКИ (ТЕРМИНАЛ) */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
                   background: #000; display: flex; flex-direction: column; padding: 20px; overflow: hidden; }
        
        #term-lines { flex: 1; font-size: 12px; line-height: 1.4; overflow: hidden; margin-bottom: 20px; }
        .term-green { color: var(--color); }
        .term-white { color: #fff; }
        .term-red { color: #ff3333; animation: blink 0.5s infinite; }
        
        .boot-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--color-dim); padding-top: 10px; }
        
        .btn { background: transparent; color: var(--color); border: 1px solid var(--color); padding: 10px 30px; 
               font-family: inherit; font-weight: bold; cursor: pointer; transition: all 0.2s; 
               box-shadow: 0 0 10px var(--color-dim); opacity: 0; pointer-events: none; }
        .btn.ready { opacity: 1; pointer-events: auto; animation: pulse 1.5s infinite; }
        .btn:active { background: var(--color); color: #000; }

        /* ЭФФЕКТЫ */
        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 15;
                     background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 255, 0, 0.03) 50%);
                     background-size: 100% 3px; pointer-events: none; }
        
        .glitch { animation: glitch 0.3s infinite; }

        @keyframes blink { 50% { opacity: 0; } }
        @keyframes pulse { 0% { box-shadow: 0 0 10px var(--color-dim); } 50% { box-shadow: 0 0 20px var(--color); } 100% { box-shadow: 0 0 10px var(--color-dim); } }
        @keyframes glitch { 0% { transform: translate(0); } 20% { transform: translate(-2px, 2px); } 40% { transform: translate(2px, -2px); } 60% { transform: translate(-1px, 0); } 100% { transform: translate(0); } }
    </style>
</head>
<body>

<video id="cam" autoplay playsinline muted webkit-playsinline></video>
<div class="scanlines"></div>
<canvas id="canvas"></canvas>

<div id="boot" class="overlay">
    <div id="term-lines">
        </div>
    <div class="boot-footer">
        <div id="boot-status">STATUS: LOADING...</div>
        <button class="btn" id="start-btn" onclick="boot()">[ ENGAGE LINK ]</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('cam');
    
    // Продвинутое состояние
    let state = { 
        p: 0, r: 0, h: 0, // Euler angles (degrees)
        s: 140, a: 850, batt: 24.8, thr: 65, verticalSpd: 0,
        active: false, frame: 0, startTime: 0,
        smoothedP: 0, smoothedR: 0 // Фильтр для горизонтa
    };

    // --- ТЕРМИНАЛ ЗАГРУЗКИ ---
    const termLines = document.getElementById('term-lines');
    const startBtn = document.getElementById('start-btn');
    const bootStatus = document.getElementById('boot-status');

    const bootSequence = [
        { t: ">> FPV COMMAND CENTER [Version 8.0.1]", c: "term-white" },
        { t: ">> Copyright (C) 2023-2024 MIL-TECH Corp.", c: "term-white" },
        { t: " ", c: "" },
        { t: "CORE::KERNEL_LOAD.......[ OK ]", c: "term-green" },
        { t: "CORE::MODULES_INIT.....[ OK ]", c: "term-green" },
        { t: "NET::STALINK_CONN......[ OK ]", c: "term-green" },
        { t: "HW::CAMERA_DETECT......[ OK ]", c: "term-green" },
        { t: "HW::GYRO_CALIBRATE.....[ OK ]", c: "term-green" },
        { t: "HW::GPS_LOCK...........[ OK ] (SAT:14 Lat:55.7 Lon:37.6)", c: "term-green" },
        { t: " ", c: "" },
        { t: ">> SECURE LINK READY.", c: "term-white" },
        { t: ">> WARNING: biometric authorization required.", c: "term-red glitch" },
        { t: ">> AWAITING USER ACTION...", c: "term-white blink" }
    ];

    let termIndex = 0;
    function typeTerminal() {
        if (termIndex < bootSequence.length) {
            const line = bootSequence[termIndex];
            const span = document.createElement('div');
            span.className = line.c;
            span.innerHTML = line.t;
            termLines.appendChild(span);
            // Скролл вниз
            termLines.scrollTop = termLines.scrollHeight;
            termIndex++;
            setTimeout(typeTerminal, 150 + Math.random() * 200);
        } else {
            // Загрузка завершена
            bootStatus.innerHTML = "STATUS: <span class='term-green'>READY</span>";
            startBtn.classList.add('ready');
        }
    }

    // Запуск терминала при старте страницы
    window.onload = typeTerminal;


    // --- ЛОГИКА HUD И ДАТЧИКОВ ---

    function boot() {
        if (startBtn.classList.contains('ready')) {
            // Запрос камеры
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(s => { video.srcObject = s; video.play(); })
                .catch(e => logTerminalError("CAM_ERR: " + e.message));

            // Запрос датчиков (iOS 13+)
            if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(res => { if(res === 'granted') window.addEventListener('deviceorientation', handleGyro); })
                    .catch(e => logTerminalError("GYRO_ERR: " + e.message));
            } else {
                window.addEventListener('deviceorientation', handleGyro);
            }

            document.getElementById('boot').style.display = 'none';
            state.active = true;
            state.startTime = Date.now();
            animate();
        }
    }

    function logTerminalError(msg) {
        const span = document.createElement('div');
        span.className = "term-red";
        span.innerText = ">> CRITICAL: " + msg;
        termLines.appendChild(span);
        termLines.scrollTop = termLines.scrollHeight;
    }

    function handleGyro(e) {
        // Углы Эйлера (iOS/Android стaндарт)
        state.p = e.beta;  // Pitch (-180 to 180)
        state.r = e.gamma; // Roll (-90 to 90)
        state.h = e.webkitCompassHeading || e.alpha || 0;
    }

    // Вспомогательная: рисование линии
    function drawLine(ctx, x1, y1, x2, y2) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    }

    // --- ПРОДВИНУТЫЙ АВИАГОРИЗОНТ ---
    function drawHorizon3D() {
        const cx = canvas.width/2, cy = canvas.height/2;
        const horizonColor = '#0f0';
        const groundColor = 'rgba(0, 100, 0, 0.15)'; // Земля (полупрозрачная)
        
        // Фильтрация (сглаживание) для плавности
        state.smoothedP += (state.p - state.smoothedP) * 0.2;
        state.smoothedR += (state.r - state.smoothedR) * 0.2;
        
        const pitchRad = state.smoothedP * Math.PI / 180;
        const rollRad = state.smoothedR * Math.PI / 180;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rollRad);

        // Расчет смещения горизонта (сферическая проекция)
        // Чувствительность тангажа (пикселей на градус)
        const pitchSens = 8; 
        let yOffset = pitchRad * (180/Math.PI) * pitchSens;

        // --- Отрисовка Земли (под горизонтом) ---
        // Рисуем большую трапецию/прямоугольник, залитый зеленым
        ctx.fillStyle = groundColor;
        ctx.beginPath();
        // Широкий охват, чтобы не было видно краев при крене
        ctx.moveTo(-canvas.width*2, yOffset); 
        ctx.lineTo(canvas.width*2, yOffset);
        ctx.lineTo(canvas.width*2, canvas.height*2);
        ctx.lineTo(-canvas.width*2, canvas.height*2);
        ctx.closePath();
        ctx.fill();

        // --- Главная линия горизонта ---
        ctx.strokeStyle = horizonColor;
        ctx.lineWidth = 3;
        // Разрыв в центре для прицела
        const gap = 60;
        const len = 250;
        drawLine(ctx, -len, yOffset, -gap, yOffset);
        drawLine(ctx, gap, yOffset, len, yOffset);

        // --- Шкала Тангажа (Лестница) ---
        ctx.lineWidth = 1;
        ctx.font = "10px monospace";
        ctx.fillStyle = horizonColor;
        
        // Отрисовка меток каждые 10 градусов
        for (let i = -90; i <= 90; i += 10) {
            if (i === 0) continue;
            let y = yOffset - (i * pitchSens);
            let w = (Math.abs(i) % 20 === 0) ? 50 : 25; // Разная длина штрихов
            
            // Видимость штрихов (только в центре экрана)
            let opacity = 1 - (Math.abs(i - (state.smoothedP)) / 50);
            if (opacity < 0) continue;
            ctx.globalAlpha = opacity;

            drawLine(ctx, -w, y, w, y);
            
            // Текст (угол)
            ctx.fillText(i, w + 10, y + 4);
            ctx.fillText(i, -w - 25, y + 4);
        }
        
        ctx.restore();
        ctx.globalAlpha = 1; // Сброс прозрачности
    }

    // --- ЛЕНТЫ (SPD / ALT) ---
    function drawTape(x, y, value, label, side, scaleFactor) {
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = '#0f0';
        ctx.fillStyle = '#0f0';
        ctx.lineWidth = 2;
        
        // Окно ленты
        ctx.strokeRect(side === 'L' ? -45 : 0, -160, 45, 320);
        ctx.clip(new Path2D(`M ${side === 'L' ? -45 : 0} -160 h 45 v 320 h -45 Z`));

        // Отрисовка делений
        // scaleFactor - сколько пикселей на единицу значения (например, 6 для скорости)
        let start = Math.floor(value /
