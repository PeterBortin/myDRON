<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical AR HUD</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: monospace; }
        
        /* Слой камеры */
        #videoBg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; opacity: 0.4; filter: grayscale(1) brightness(0.8) contrast(1.2);
            z-index: 1; display: none;
        }

        #hudCanvas { position: relative; display: block; width: 100vw; height: 100vh; z-index: 5; pointer-events: none; }

        .crt {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 2px, 2px 100%; z-index: 10; pointer-events: none;
        }

        /* Терминал */
        #termOverlay {
            position: fixed; top: 20px; left: 20px; right: 20px; bottom: 100px;
            background: rgba(0, 20, 0, 0.9); border: 1px solid #0f0; color: #0f0;
            padding: 15px; font-size: 12px; overflow-y: auto; display: none; z-index: 15;
        }

        .nav-bar {
            position: fixed; bottom: 0; width: 100%; height: 80px;
            background: rgba(0, 10, 0, 0.8); border-top: 1px solid #0f0;
            display: flex; justify-content: space-around; align-items: center; z-index: 20;
        }

        .btn {
            background: transparent; color: #0f0; border: 1px solid #0f0;
            padding: 12px 20px; text-transform: uppercase; font-weight: bold;
            box-shadow: 0 0 5px #0f0; cursor: pointer;
        }
        .btn:active { background: #0f0; color: #000; }
    </style>
</head>
<body>
    <video id="videoBg" autoplay playsinline></video>
    <div class="crt"></div>
    <canvas id="hudCanvas"></canvas>
    
    <div id="termOverlay">
        <div id="termContent">> SYSTEM BOOT...<br>> INITIALIZING SENSORS...<br></div>
    </div>

    <div class="nav-bar">
        <button class="btn" onclick="toggleTerminal()">Terminal</button>
        <button class="btn" onclick="initSensors()">Sensors</button>
    </div>

    <script>
        const canvas = document.getElementById('hudCanvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('videoBg');
        const term = document.getElementById('termOverlay');
        const termOut = document.getElementById('termContent');

        let width, height;
        let pitch = 0, roll = 0, yaw = 0;
        let sensorsActive = false;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function log(msg) {
            termOut.innerHTML += `> ${msg}<br>`;
            term.scrollTop = term.scrollHeight;
        }

        function toggleTerminal() {
            term.style.display = term.style.display === 'block' ? 'none' : 'block';
        }

        // Инициализация камеры и акселерометра
        async function initSensors() {
            log("REQUESTING SENSOR ACCESS...");
            
            // 1. Камера
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, 
                    audio: false 
                });
                video.srcObject = stream;
                video.style.display = 'block';
                log("CAMERA: CONNECTED");
            } catch (e) { log("CAMERA: FAILED - " + e.message); }

            // 2. Акселерометр/Гироскоп (iOS требует разрешения)
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(state => {
                        if (state === 'granted') window.addEventListener('deviceorientation', handleMotion);
                    });
            } else {
                window.addEventListener('deviceorientation', handleMotion);
            }
            sensorsActive = true;
            log("GYRO: CALIBRATED");
        }

        function handleMotion(e) {
            // Адаптация углов под HUD
            roll = e.gamma;  // Наклон влево/вправо
            pitch = e.beta - 45; // Наклон вперед/назад (смещение для удобства чтения)
        }

        function drawHUD() {
            ctx.clearRect(0, 0, width, height);
            ctx.strokeStyle = '#0f0';
            ctx.fillStyle = '#0f0';
            ctx.lineWidth = 2;

            // Сетка прицела (центр)
            ctx.save();
            ctx.translate(width/2, height/2);
            ctx.rotate(roll * Math.PI / 180);
            ctx.translate(0, pitch * 4);

            // Линии горизонта
            ctx.beginPath();
            ctx.moveTo(-100, 0); ctx.lineTo(-40, 0);
            ctx.moveTo(40, 0); ctx.lineTo(100, 0);
            ctx.stroke();

            // Тангаж (шкалы)
            for(let i=-3; i<=3; i++) {
                if(i===0) continue;
                let y = i * 50;
                ctx.globalAlpha = 0.4;
                ctx.beginPath();
                ctx.moveTo(-30, y); ctx.lineTo(30, y);
                ctx.stroke();
                ctx.fillText(i*10, 35, y+5);
                ctx.globalAlpha = 1;
            }
            ctx.restore();

            // Инфо-панели
            ctx.font = '10px monospace';
            ctx.fillText(`RLL: ${Math.round(roll)}°`, 20, height - 100);
            ctx.fillText(`PTCH: ${Math.round(pitch)}°`, 20, height - 115);
            
            // Рамка сканера (статичная)
            ctx.strokeRect(width/2 - 60, height/2 - 60, 120, 120);
            ctx.beginPath();
            ctx.moveTo(width/2, height/2 - 70); ctx.lineTo(width/2, height/2 - 50);
            ctx.stroke();

            requestAnimationFrame(drawHUD);
        }

        drawHUD();
    </script>
</body>
</html>
