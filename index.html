<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>DRONE PFD v12.0</title>
<!--
  DRONE PFD v12.0 — мобільний пілотажний дисплей + система захвату цілей (ландшафт, FPV)
  ────────────────────────────────────────────────────────────────────────────────────
  АРХІТЕКТУРА: TelemetrySource → State → Renderer. Рендер малює тільки зі стейту.
    Джерела: PhoneIMU (deviceorientation[absolute]+devicemotion), PhoneGPS (watchPosition).
    Пізніше сюди підключиться MSP/CRSF (Web Serial / WebSocket) без змін рендера.

  БАЧЕННЯ (WebGL): БАЗА (посилений) / ТЕПЛО (синтетичний тепловізор: локальна нормалізація
    + підсилення в темряві → тепловий силует об'єктів, що виділяються з фону; НЕ реальна
    температура — телефон не має IR-сенсора) / НІЧ (gen-3 підсилення + зелень + шум).
    Кнопка поряд з GPS. Fallback на CSS-фільтр, якщо WebGL недоступний (позначка GL:OFF).

  ЦІЛІ — ЧЕСНО ПРО МЕЖІ: це НЕ навчений розпізнавач. Виявлення = різниця кадрів (рух)
    + гарячі плями (яскравість у тепловому сенсі). Класифікація = сигнатура (HOT/WARM/
    COLD за тепловим контрастом) + геометрія (ВЕРТ/ГОРИЗ/МАСА/ТОЧКА). Тип на кшталт
    ТЕПЛ.МАСА — це виміряні ознаки, не заявка «це танк». Впевненість рахується з
    реальних величин (стабільність треку × контраст × рух). Дальність НЕ показується
    (немає depth) — лише азимут до цілі та кутовий розмір.
  ЗАХВАТ: трекер-по-детекції (IoU+центроїд, EMA, підтвердження N влучань, скид M промахів).
    Тап по цілі = жорсткий лок. Найближча до прицілу = авто-наведення (світліша).

  МАТЕМАТИКА АТИТЮДУ: alpha/beta/gamma → матриця W3C → pitch/roll відносно осі камери.
    Сирі beta/gamma не використовуються (це давало gimbal lock). Перевірено харнесом.
  ЯДРО ДЕТЕКТОРА/ТРЕКЕРА — чисті функції, перевірені синтетичним харнесом (detect-harness.mjs).
  ПОЛЬОВІ КОНСТАНТИ вгорі <script>: SCREEN_ANGLE_FLIP, IOS_HDG_CORR, CAM_HFOV_DEG, DET.
  Нуль зовнішніх залежностей — працює офлайн.
-->
<style>
:root{
  --g:#00ff41; --g-dim:rgba(0,255,65,.62); --g-faint:rgba(0,255,65,.18);
  --amb:#ffb000; --red:#ff3b30; --bg:#000;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --sat:env(safe-area-inset-top,0px);  --sab:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%}
body{background:var(--bg);overflow:hidden;font-family:var(--mono);color:var(--g);touch-action:manipulation}

#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;
  filter:brightness(.66) contrast(1.35) saturate(1.1) hue-rotate(85deg)}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:2;display:block}
#hud{position:fixed;inset:0;z-index:12;pointer-events:none}
#touch{position:fixed;inset:0;z-index:20;pointer-events:auto;background:transparent}

.scanlines{position:fixed;inset:0;z-index:14;pointer-events:none;
  background:linear-gradient(rgba(18,16,16,0) 50%,rgba(0,255,65,.04) 50%),
             linear-gradient(90deg,rgba(255,0,0,.018),rgba(0,255,65,.01),rgba(0,0,255,.018));
  background-size:100% 4px,3px 100%}
.vignette{position:fixed;inset:0;z-index:15;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.5) 100%)}

#statusbar{position:fixed;top:calc(var(--sat) + 6px);left:calc(var(--sal) + 12px);
  z-index:40;font-size:11px;letter-spacing:.06em;color:var(--g-dim);
  text-shadow:0 0 6px rgba(0,255,65,.5);pointer-events:none;white-space:nowrap}

.chips{position:fixed;bottom:calc(var(--sab) + 10px);left:calc(var(--sal) + 12px);
  z-index:40;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:70vw}
.chip{font-family:var(--mono);font-size:12px;letter-spacing:.05em;color:var(--g);
  background:rgba(0,20,6,.72);border:1px solid var(--g-dim);padding:0 12px;
  min-height:42px;display:flex;align-items:center;border-radius:2px}
button.chip{cursor:pointer;pointer-events:auto}
button.chip:active{background:rgba(0,255,65,.18)}
.chip.amb{color:var(--amb);border-color:var(--amb)}
.chip.red{color:var(--red);border-color:var(--red)}
.chip.off{color:var(--g-dim);border-color:var(--g-faint)}

.btns{position:fixed;bottom:calc(var(--sab) + 10px);right:calc(var(--sar) + 12px);
  z-index:40;display:flex;gap:8px}
.btn{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--g);
  background:rgba(0,20,6,.72);border:1px solid var(--g);padding:0 15px;
  min-height:46px;min-width:46px;cursor:pointer;border-radius:2px}
.btn:active{background:rgba(0,255,65,.22)}

#dbgBtn{position:fixed;top:calc(var(--sat) + 6px);right:calc(var(--sar) + 12px);
  z-index:40;font-family:var(--mono);font-size:10px;color:var(--g-dim);
  background:transparent;border:1px solid var(--g-faint);padding:6px 9px;cursor:pointer}
#debug{position:fixed;top:calc(var(--sat) + 36px);right:calc(var(--sar) + 12px);
  z-index:41;display:none;background:rgba(0,0,0,.88);border:1px solid var(--g-dim);
  padding:9px 11px;font-size:10px;line-height:1.5;color:var(--g);
  min-width:236px;white-space:pre;pointer-events:none}

#toast{position:fixed;bottom:calc(var(--sab) + 62px);left:50%;transform:translateX(-50%);
  z-index:60;background:rgba(0,0,0,.85);border:1px solid var(--g);color:var(--g);
  font-size:12px;letter-spacing:.05em;padding:9px 15px;opacity:0;
  transition:opacity .18s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}

#rotate{position:fixed;inset:0;z-index:250;display:none;background:rgba(0,0,0,.93);
  align-items:center;justify-content:center;flex-direction:column;gap:22px;text-align:center}
@media (orientation:portrait){ body.booted #rotate{display:flex} }
.phone{width:46px;height:78px;border:2.5px solid var(--g);border-radius:7px;position:relative;
  animation:rot 2.2s ease-in-out infinite}
.phone::after{content:"";position:absolute;bottom:5px;left:50%;transform:translateX(-50%);
  width:14px;height:2.5px;background:var(--g)}
@keyframes rot{0%,20%{transform:rotate(0)}55%,100%{transform:rotate(90deg)}}
#rotate p{font-size:14px;letter-spacing:.2em}

#boot{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.96);
  display:flex;align-items:center;justify-content:center;transition:opacity .45s}
#boot.off{opacity:0;pointer-events:none}
.bframe{border:2px solid var(--g);background:#000;padding:26px 30px;max-width:min(92vw,560px);
  width:100%;box-shadow:0 0 34px rgba(0,255,65,.22),inset 0 0 24px rgba(0,255,65,.05)}
.btitle{font-size:23px;letter-spacing:.26em;text-shadow:0 0 12px rgba(0,255,65,.8)}
.btitle small{font-size:12px;letter-spacing:.14em;color:var(--g-dim);margin-left:8px}
.bsub{margin-top:6px;font-size:11px;letter-spacing:.2em;color:var(--g-dim)}
#blog{margin-top:16px;font-size:12.5px;line-height:1.7;min-height:132px;color:var(--g)}
#blog .bn{color:var(--g-dim)}
#blog .ok{color:var(--g)} #blog .warn{color:var(--amb)} #blog .err{color:var(--red)}
#armBtn{margin-top:18px;width:100%;background:var(--g);color:#000;border:none;
  padding:15px 0;font-family:var(--mono);font-weight:700;font-size:17px;
  letter-spacing:.3em;cursor:pointer}
#armBtn:disabled{opacity:.35}
.bhint{margin-top:10px;font-size:10.5px;color:var(--g-dim);letter-spacing:.04em;line-height:1.5}

@media (prefers-reduced-motion:reduce){ .phone{animation:none;transform:rotate(90deg)} }
</style>
</head>
<body>

<video id="cam" autoplay playsinline muted webkit-playsinline></video>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="touch"></div>
<div class="scanlines"></div>
<div class="vignette"></div>

<div id="statusbar">PFD v12.0</div>

<div class="chips">
  <span class="chip" id="gpsChip">GPS: —</span>
  <button class="chip" id="visChip">БАЧЕННЯ: БАЗА</button>
  <button class="chip" id="detChip">ЦІЛІ: 0</button>
  <button class="chip" id="audChip">АУДІО: ON</button>
</div>

<div class="btns">
  <button class="btn" id="trimBtn" title="тап — трим, довгий тап — скид">ТРИМ</button>
  <button class="btn" id="fsBtn">ЕКРАН</button>
</div>

<button id="dbgBtn">DBG</button>

<div id="rotate"><div class="phone"></div><p>ПОВЕРНИ В ЛАНДШАФТ</p></div>

<div id="boot">
  <div class="bframe">
    <div class="btitle">DRONE PFD <small>v12.0</small></div>
    <div class="bsub">ЛАНДШАФТ · БАЧЕННЯ · ГІРО · GPS · ЗАХВАТ ЦІЛЕЙ</div>
    <pre id="blog"></pre>
    <button id="armBtn">АРМ</button>
    <div class="bhint">iOS спитає дозвіл на датчики руху — треба дозволити. Тап по цілі = лок. Трим: тап = центр, довгий = скид.</div>
  </div>
</div>

<script>
'use strict';
/* ═══════════════ ПОЛЬОВІ КОНСТАНТИ ═══════════════ */
const SCREEN_ANGLE_FLIP = false;                      // true, якщо крен у ландшафті дзеркальний
const IOS_HDG_CORR = { 0: 0, 90: 90, 180: 180, 270: -90 }; // корекція webkitCompassHeading за кутом екрана
const CAM_HFOV_DEG = 66;                              // гориз. поле зору камери (для азимута цілі)
const MOTION_THR = 18;                                // поріг різниці кадрів (0..255)
// Базові параметри трекера (не залежать від чутливості):
const DET_BASE = { maxAreaFrac: 0.30, gate: 0.14, posA: 0.45, featA: 0.40, hitsMin: 4, missMax: 8, hz: 15 };
// Пресети чутливості детектора (тап по ЦІЛІ циклює): менша чутливість = менше хибних + тихіше.
const SENS = {
  'НИЗ': { minArea: 74, hotK: 2.3, surroundMin: 26, fillMin: 0.44, motionFracMin: 0.42, hotFracMin: 0.55, maxShow: 3 },
  'СЕР': { minArea: 50, hotK: 1.9, surroundMin: 18, fillMin: 0.38, motionFracMin: 0.36, hotFracMin: 0.52, maxShow: 5 },
  'ВИС': { minArea: 34, hotK: 1.6, surroundMin: 12, fillMin: 0.30, motionFracMin: 0.30, hotFracMin: 0.50, maxShow: 8 }
};
function buildDetP(s) { return Object.assign({}, DET_BASE, SENS[s] || SENS['СЕР']); }
const DW = 192, DH = 108;                             // роздільність обробки

const G = '#00ff41', GDIM = 'rgba(0,255,65,.62)', GFAINT = 'rgba(0,255,65,.18)',
      AMB = '#ffb000', RED = '#ff3b30';
const MONO = 'ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace';
const CARD = { 0: 'Пн', 90: 'Сх', 180: 'Пд', 270: 'Зх' };
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU_ATT = 0.08, TAU_HDG = 0.25, TAU_SLIP = 0.30, TAU_TAPE = 0.35;

/* ═══════════════ МАТЕМАТИКА АТИТЮДУ (перевірено attitude-harness.mjs, 21/21) ═══════════════ */
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const clamp1 = v => Math.max(-1, Math.min(1, v));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function rotZXY(alphaDeg, betaDeg, gammaDeg) {
  const a = alphaDeg * D2R, b = betaDeg * D2R, g = gammaDeg * D2R;
  const cA = Math.cos(a), sA = Math.sin(a), cB = Math.cos(b), sB = Math.sin(b), cG = Math.cos(g), sG = Math.sin(g);
  return [
    cA * cG - sA * sB * sG, -sA * cB, cA * sG + sA * sB * cG,
    sA * cG + cA * sB * sG,  cA * cB, sA * sG - cA * sB * cG,
    -cB * sG,                sB,      cB * cG
  ];
}
function attitudeFromMatrix(m, screenAngleDeg) {
  const fx = -m[2], fy = -m[5], fz = -m[8];
  const pitch = Math.asin(clamp1(fz)) * R2D;
  const A = (screenAngleDeg || 0) * D2R, sx = Math.cos(A), sy = -Math.sin(A);
  const rx = m[0] * sx + m[1] * sy, ry = m[3] * sx + m[4] * sy, rz = m[6] * sx + m[7] * sy;
  const hl = Math.hypot(fy, fx);
  if (hl < 1e-6) return { pitch, roll: null };
  const hx = fy / hl, hy = -fx / hl;
  const cosr = hx * rx + hy * ry;
  const sinr = (hy * rz) * fx + (-hx * rz) * fy + (hx * ry - hy * rx) * fz;
  return { pitch, roll: Math.atan2(sinr, cosr) * R2D };
}
function attitudeFromEuler(a, b, g, ang) { return attitudeFromMatrix(rotZXY(a || 0, b || 0, g || 0), ang); }
function headingFromMatrix(m) {
  let ex = -m[2], ny = -m[5];
  if (Math.hypot(ex, ny) < 0.35) { ex = m[1]; ny = m[4]; }
  if (Math.hypot(ex, ny) < 1e-6) return null;
  return (Math.atan2(ex, ny) * R2D + 360) % 360;
}

/* ═══════════════ ЯДРО ДЕТЕКТОРА/ТРЕКЕРА — ЧИСТІ ФУНКЦІЇ (detect-harness.mjs) ═══════════════ */
// Інтегральне зображення для швидких сум/середніх по прямокутнику.
function integralImage(L, W, H) {
  const IW = W + 1, II = new Float64Array(IW * (H + 1));
  for (let y = 0; y < H; y++) { let row = 0; for (let x = 0; x < W; x++) { row += L[y * W + x]; II[(y + 1) * IW + (x + 1)] = II[y * IW + (x + 1)] + row; } }
  return II;
}
function rectSum(II, W, x0, y0, x1, y1) { const IW = W + 1; return II[(y1 + 1) * IW + (x1 + 1)] - II[y0 * IW + (x1 + 1)] - II[(y1 + 1) * IW + x0] + II[y0 * IW + x0]; }
function dilate(m, W, H) { const o = new Uint8Array(W * H); for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { let v = 0; for (let dy = -1; dy <= 1 && !v; dy++) for (let dx = -1; dx <= 1 && !v; dx++) { const xx = x + dx, yy = y + dy; if (xx >= 0 && xx < W && yy >= 0 && yy < H && m[yy * W + xx]) v = 1; } o[y * W + x] = v; } return o; }
function erode(m, W, H) { const o = new Uint8Array(W * H); for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { let v = 1; for (let dy = -1; dy <= 1 && v; dy++) for (let dx = -1; dx <= 1 && v; dx++) { const xx = x + dx, yy = y + dy; if (!(xx >= 0 && xx < W && yy >= 0 && yy < H) || !m[yy * W + xx]) v = 0; } o[y * W + x] = v; } return o; }
// Маска кандидатів: рух ∪ гаряче (глобальний поріг), потім закриття (dilate×2, erode×1),
// щоб злити фрагменти однієї цілі в один блоб. Дискримінація walls/clutter — на рівні регіонів.
function buildMaskV2(L, motion, stats, W, H, P) {
  const N = W * H, hot = new Uint8Array(N), cand = new Uint8Array(N);
  const globalHi = Math.min(255, stats.mean + P.hotK * stats.std);
  for (let i = 0; i < N; i++) { hot[i] = L[i] > globalHi ? 1 : 0; cand[i] = (motion[i] || hot[i]) ? 1 : 0; }
  let m = cand; m = dilate(m, W, H); m = dilate(m, W, H); m = erode(m, W, H);
  return { mask: m, hot };
}
// Зв'язні компоненти (flood fill, 4-зв'язність) з накопиченням ознак.
function connectedComponents(mask, L, motion, hot, W, H) {
  const seen = new Uint8Array(W * H), stack = new Int32Array(W * H), out = [];
  for (let s = 0; s < W * H; s++) {
    if (!mask[s] || seen[s]) continue;
    let sp = 0; stack[sp++] = s; seen[s] = 1;
    let x0 = W, y0 = H, x1 = 0, y1 = 0, area = 0, ls = 0, mc = 0, hc = 0, sx = 0, sy = 0;
    while (sp > 0) {
      const p = stack[--sp], x = p % W, y = (p / W) | 0;
      area++; ls += L[p]; mc += motion[p] ? 1 : 0; hc += hot[p] ? 1 : 0; sx += x; sy += y;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      let q;
      if (x > 0) { q = p - 1; if (mask[q] && !seen[q]) { seen[q] = 1; stack[sp++] = q; } }
      if (x < W - 1) { q = p + 1; if (mask[q] && !seen[q]) { seen[q] = 1; stack[sp++] = q; } }
      if (y > 0) { q = p - W; if (mask[q] && !seen[q]) { seen[q] = 1; stack[sp++] = q; } }
      if (y < H - 1) { q = p + W; if (mask[q] && !seen[q]) { seen[q] = 1; stack[sp++] = q; } }
    }
    out.push({ x0, y0, x1, y1, area, lumaSum: ls, motionCount: mc, hotCount: hc, cx: sx / area, cy: sy / area });
  }
  return out;
}
// Гейтинг + нормалізація в [0..1]. Ключове: РУХ проходить завжди; статичний «гарячий»
// об'єкт проходить лише якщо компактний І виділяється над оточенням (не стіна/фон).
function regionsToDetsV2(regs, L, II, stats, W, H, P) {
  const dets = [], maxArea = W * H * P.maxAreaFrac;
  for (const r of regs) {
    const bw = r.x1 - r.x0 + 1, bh = r.y1 - r.y0 + 1, bboxA = bw * bh;
    if (r.area < P.minArea || r.area > maxArea) continue;
    if (bw > W * 0.72 && bh > H * 0.72) continue;                       // майже весь кадр — не ціль
    let borders = 0; if (r.x0 <= 0) borders++; if (r.y0 <= 0) borders++; if (r.x1 >= W - 1) borders++; if (r.y1 >= H - 1) borders++;
    if (borders >= 3) continue;                                         // фон/стіна/підлога
    const fill = r.area / bboxA, motionFrac = r.motionCount / r.area, hotFrac = r.hotCount / r.area, inMean = r.lumaSum / r.area;
    const ex = Math.round(Math.max(bw, bh) * 0.6) + 2;                  // кільце навколо bbox
    const rx0 = Math.max(0, r.x0 - ex), ry0 = Math.max(0, r.y0 - ex), rx1 = Math.min(W - 1, r.x1 + ex), ry1 = Math.min(H - 1, r.y1 + ex);
    const ringSum = rectSum(II, W, rx0, ry0, rx1, ry1) - rectSum(II, W, r.x0, r.y0, r.x1, r.y1);
    const ringA = (rx1 - rx0 + 1) * (ry1 - ry0 + 1) - bboxA;
    const surround = inMean - (ringA > 0 ? ringSum / ringA : inMean);   // наскільки регіон «гарячіший» за оточення
    const motionCue = motionFrac >= P.motionFracMin;
    const hotCue = hotFrac >= P.hotFracMin && surround >= P.surroundMin && fill >= P.fillMin;
    if (!motionCue && !hotCue) continue;
    dets.push({
      cx: (r.x0 + bw / 2) / W, cy: (r.y0 + bh / 2) / H, w: bw / W, h: bh / H,
      areaPx: r.area, meanL: inMean, hotFrac, motionFrac, aspect: bw / bh, surround, fill
    });
  }
  return dets;
}
// Класифікація: сигнатура (виділення над оточенням) + геометрія (форма) + доменний тип.
function classifyDet(f, stats, P) {

  else if (sig === 'HOT' && geom === 'ВЕРТ') type = 'ФІГУРА?';
  else if (sig === 'HOT' && geom === 'ТОЧКА') type = 'ТЕПЛ.ТЧК';
  else if (sig === 'HOT') type = 'ТЕПЛ.ЦІЛЬ';

    const d = dets[di]; let best = -1, bd = 1e9;

        feat: { meanL: d.meanL, hotFrac: d.hotFrac, motionFrac: d.motionFrac, aspect: d.aspect, areaPx: d.areaPx, surround: d.surround, fill: d.fill },
        hits: 1, misses: 0, bornT: t, lastT: t, status: 'ACQ', conf: 0,

  const d = S.det;

  // авто-наведення: найближча до центру підтверджена ціль (якщо ручного лока нема)

  ctx.drawImage(st, 0, 0, st.width, st.height, 0, 0, W, H);
  drawAttitude(now); drawBank(); drawHeading(now);
  drawTape('L', S.spd, { ppu: 2.6, minor: 5, major: 20, min: 0 }, now);
  drawTape('R', S.alt, { ppu: 1.5, minor: 10, major: 50, min: null }, now);
  drawTargets(now);
}

/* ═══════════════ АПДЕЙТ СТЕЙТУ ═══════════════ */
function kOf(dt, tau) { return 1 - Math.exp(-dt / tau); }
function update(dt, now) {
  const ang = effAngle(), tSec = now / 1000, o = freshOri();
  if (o) {
    const att = attitudeFromEuler(o.a || 0, o.b, o.g, ang), tp = att.pitch - S.trimP, k = kOf(dt, TAU_ATT);
    S.att.p += (tp - S.att.p) * k;
    if (att.roll != null) { const tr = att.roll - S.trimR, dr = ((tr - S.att.r + 540) % 360 + 360) % 360 - 180; S.att.r += dr * k; S.att.r = ((S.att.r + 540) % 360 + 360) % 360 - 180; }
    S.att.ok = true;
  } else S.att.ok = false;

  let target = null, mode = '—';
  if (S.hasAbs && now - S.oriAbs.ts < 1500 && S.oriAbs.a != null) { target = headingFromMatrix(rotZXY(S.oriAbs.a, S.oriAbs.b || 0, S.oriAbs.g || 0)); mode = 'MAG'; }
  else if (S.webkitHdg != null && now - S.webkitTs < 1500) { const corr = IOS_HDG_CORR[ang] !== undefined ? IOS_HDG_CORR[ang] : 0; target = ((S.webkitHdg + corr) % 360 + 360) % 360; mode = 'MAG'; }
  else if (o && o.a != null) { target = headingFromMatrix(rotZXY(o.a, o.b, o.g)); mode = 'REL'; }
  if (target != null) {
    const cur = ((S.hdg.cont % 360) + 360) % 360, dd = ((target - cur + 540) % 360 + 360) % 360 - 180;
    S.hdg.cont += dd * kOf(dt, TAU_HDG); S.hdg.val = ((S.hdg.cont % 360) + 360) % 360; S.hdg.ok = true; S.hdg.mode = mode;
  } else { S.hdg.ok = false; S.hdg.mode = '—'; }

  if (now - S.mot.ts < 1200 && o) {
    S.slipOk = true; const A = ang * D2R, sx = Math.cos(A), sy = -Math.sin(A);
    const lat = S.mot.sign * (S.mot.x * sx + S.mot.y * sy) / 9.81; S.slip += (clamp(lat, -0.6, 0.6) - S.slip) * kOf(dt, TAU_SLIP);
  } else S.slipOk = false;

  const kt = kOf(dt, TAU_TAPE);
  for (const ch of [S.spd, S.alt]) if (ch.raw != null && ch.val != null) ch.val += (ch.raw - ch.val) * kt;

  if (now - S._hzT > 1000) { S.oriHz = S._hzC * 1000 / Math.max(1, now - S._hzT); S._hzC = 0; S._hzT = now; }
}

/* ═══════════════ ГОЛОВНИЙ ЦИКЛ ═══════════════ */
let lastT = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (!lastT) { lastT = t; return; }
  const dt = Math.min(0.1, (t - lastT) / 1000) || 0.016; lastT = t; S.fps += (1 / dt - S.fps) * 0.05;
  renderGL(t);
  if (t - S.det.lastTick >= 1000 / S.detP.hz) { S.det.lastTick = t; detectTick(t); }
  update(dt, t); draw(t);
}

/* ═══════════════ СТАТУС / ЧІПИ / ДЕБАГ ═══════════════ */
function fmt1(v) { return (v >= 0 ? '+' : '') + v.toFixed(1); }
function refreshHUDText() {
  const giro = S.att.ok ? 'ОК' : 'НЕМА';
  let gpsTxt = S.gps.denied ? 'ВІДМОВА' : (gpsFresh() ? '±' + Math.round(S.gps.acc) + 'М' : 'ПОШУК…');
  statusEl.textContent = 'PFD v12 · ' + VIS_LABEL[S.vis] + ' · ГІРО ' + giro + ' · HDG ' + S.hdg.mode + ' · GPS ' + gpsTxt + ' · Ц:' + S.det.count;

  if (S.gps.denied) { gpsChip.textContent = 'GPS: ВІДМОВА'; gpsChip.className = 'chip red'; }
  else if (gpsFresh()) { gpsChip.textContent = 'GPS: ±' + Math.round(S.gps.acc) + ' М'; gpsChip.className = 'chip'; }
  else { gpsChip.textContent = 'GPS: ПОШУК…'; gpsChip.className = 'chip amb'; }

  detChip.textContent = S.detOn ? ('ЦІЛІ: ' + S.detSens + ' · ' + S.det.count) : 'ЦІЛІ: ВИМК';
  detChip.className = 'chip' + (S.detOn ? (S.det.count ? ' amb' : '') : ' off');
  audChip.textContent = 'АУДІО: ' + (S.audOn ? 'ON' : 'OFF');
  audChip.className = 'chip' + (S.audOn ? '' : ' off');

  if (debugEl.style.display === 'block') {
    const o = freshOri(), f = v => v == null ? '·' : (+v).toFixed(1);
    const pT = S.det.state.tracks.find(x => x.id === S.det.state.primaryId);
    debugEl.textContent =
      'α β γ    ' + (o ? f(o.a) + ' ' + f(o.b) + ' ' + f(o.g) : '— — —') + '\n' +
      'perm     ori:' + S.oriPerm + ' mot:' + S.motPerm + '\n' +
      'angle    ' + effAngle() + '° gl:' + (S.glOk ? '1' : '0') + '\n' +
      'pitch    ' + S.att.p.toFixed(2) + '°   roll ' + S.att.r.toFixed(2) + '°\n' +
      'hdg      ' + S.hdg.val.toFixed(1) + '° ' + S.hdg.mode + '\n' +
      'trim     P' + fmt1(S.trimP) + ' R' + fmt1(S.trimR) + '\n' +
      'vis      ' + S.vis + '   ori ' + S.oriHz.toFixed(0) + 'Hz\n' +
      'sens     ' + (S.detOn ? S.detSens + ' show' + S.detP.maxShow : 'OFF') + '\n' +
      'slip     ' + S.slip.toFixed(3) + ' g   acc s:' + S.mot.sign + '\n' +
      'gps      ' + f(S.gps.acc) + ' м\n' +
      'tapes    ' + f(S.spd.val) + ' / ' + f(S.alt.val) + '\n' +
      'det      L' + S.det.stats.mean.toFixed(0) + '±' + S.det.stats.std.toFixed(0) + '  trk:' + S.det.state.tracks.length + '\n' +
      'primary  #' + (S.det.state.primaryId || '—') + (pT ? '  s' + pT.feat.surround.toFixed(0) + ' f' + pT.feat.fill.toFixed(2) : '') + '\n' +
      'fps      ' + S.fps.toFixed(0);
  }
}

/* ═══════════════ КЕРУВАННЯ ═══════════════ */
function persistTrim() { localStorage.setItem('pfd.trimP', String(S.trimP)); localStorage.setItem('pfd.trimR', String(S.trimR)); }
let trimTimer = null, trimLong = false;
const trimBtn = $('trimBtn');
trimBtn.addEventListener('contextmenu', e => e.preventDefault());
trimBtn.addEventListener('pointerdown', () => { trimLong = false; trimTimer = setTimeout(() => { trimLong = true; S.trimP = 0; S.trimR = 0; persistTrim(); vib([30, 60, 30]); toast('ТРИМ СКИНУТО'); }, 600); });
function trimUp() { clearTimeout(trimTimer); if (trimLong) return; if (!S.att.ok) { toast('НЕМА АТИТЮДУ — ТРИМ НЕ СТАВЛЮ'); return; } S.trimP += S.att.p; S.trimR += S.att.r; persistTrim(); vib(35); toast('ТРИМ  P ' + fmt1(S.trimP) + '°  R ' + fmt1(S.trimR) + '°'); }
trimBtn.addEventListener('pointerup', trimUp);
trimBtn.addEventListener('pointercancel', () => clearTimeout(trimTimer));
trimBtn.addEventListener('pointerleave', () => clearTimeout(trimTimer));

const VIS_CYCLE = ['BASE', 'THERMAL', 'NIGHT'];
visChip.addEventListener('click', () => { S.vis = VIS_CYCLE[(VIS_CYCLE.indexOf(S.vis) + 1) % 3]; localStorage.setItem('pfd.vis', S.vis); applyVision(); toast('БАЧЕННЯ: ' + VIS_LABEL[S.vis]); refreshHUDText(); });
const SENS_CYCLE = ['ВИМК', 'НИЗ', 'СЕР', 'ВИС'];
detChip.addEventListener('click', () => {
  const cur = S.detOn ? S.detSens : 'ВИМК', nx = SENS_CYCLE[(SENS_CYCLE.indexOf(cur) + 1) % SENS_CYCLE.length];
  if (nx === 'ВИМК') { S.detOn = false; }
  else { S.detOn = true; S.detSens = nx; S.detP = buildDetP(nx); localStorage.setItem('pfd.sens', nx); }
  localStorage.setItem('pfd.det', S.detOn ? '1' : '0');
  if (!S.detOn) { S.det.state.tracks = []; S.det.state.primaryId = 0; S.det.prevL = null; S.det.count = 0; }
  toast(S.detOn ? ('ЦІЛІ: ' + S.detSens + ' ЧУТЛ.') : 'ДЕТЕКЦІЯ OFF'); refreshHUDText();
});
audChip.addEventListener('click', () => { S.audOn = !S.audOn; localStorage.setItem('pfd.aud', S.audOn ? '1' : '0'); if (S.audOn && AC && AC.state === 'suspended') AC.resume(); toast(S.audOn ? 'АУДІО ON' : 'АУДІО OFF'); refreshHUDText(); });

// тап по цілі = лок / зняти лок
$('touch').addEventListener('pointerdown', ev => {
  if (!S.detOn) return;
  const nx = ev.clientX / W, ny = ev.clientY / H;
  let best = 0, bd = 0.09;
  for (const T of S.det.state.tracks) { if (T.status !== 'TRK') continue; const dd = Math.hypot(T.cx - nx, T.cy - ny); if (dd < bd) { bd = dd; best = T.id; } }
  if (best) {
    if (S.det.state.primaryId === best) { S.det.state.primaryId = 0; sndUnlock(); vib(30); toast('ЛОК ЗНЯТО'); }
    else { S.det.state.primaryId = best; sndLock(); vib([25, 30, 25]); toast('ЛОК ЦІЛІ #' + best); }
  } else if (S.det.state.primaryId) { S.det.state.primaryId = 0; sndUnlock(); toast('ЛОК ЗНЯТО'); }
});

$('fsBtn').addEventListener('click', async () => {
  try {
    if (!document.fullscreenElement) { await document.documentElement.requestFullscreen({ navigationUI: 'hide' }); if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); }
    else await document.exitFullscreen();
  } catch (e) { toast('ФУЛСКРІН ТУТ НЕ ЖИВЕ — ДОДАЙ НА ПОЧАТКОВИЙ ЕКРАН'); }
});
$('dbgBtn').addEventListener('click', () => { debugEl.style.display = debugEl.style.display === 'block' ? 'none' : 'block'; });

/* ═══════════════ WAKE LOCK ═══════════════ */
let wl = null;
async function lockWake() { try { if ('wakeLock' in navigator) wl = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.booted) lockWake(); });

/* ═══════════════ BOOT ═══════════════ */
const blog = $('blog');
function bootLine(name) { const div = document.createElement('div'); const bn = document.createElement('span'); bn.className = 'bn'; bn.textContent = '> ' + name.padEnd(15, '·') + ' '; const bs = document.createElement('span'); bs.textContent = '…'; div.appendChild(bn); div.appendChild(bs); blog.appendChild(div); return bs; }
function setLine(el, text, cls) { el.textContent = text; el.className = cls || 'ok'; }
async function waitOriEvent(ms) { const t0 = performance.now(); while (performance.now() - t0 < ms) { if (S.everOri) return true; await sleep(90); } return S.everOri; }

async function arm() {
  const btn = $('armBtn'); btn.disabled = true; S.armTs = performance.now();
  // 1) ДОЗВІЛ НА ДАТЧИКИ — НАЙПЕРШЕ, поки активний жест користувача.
  //    Обидва requestPermission ІНІЦІЮЄМО синхронно (ДО будь-якого await),
  //    інакше iOS втрачає user-activation і гіроскоп лишається мертвим.
  let _oriReq = null, _motReq = null;
  try { if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) _oriReq = DeviceOrientationEvent.requestPermission(); } catch (e) { S.oriPerm = 'error'; }
  try { if (window.DeviceMotionEvent && DeviceMotionEvent.requestPermission) _motReq = DeviceMotionEvent.requestPermission(); } catch (e) { S.motPerm = 'error'; }
  S.oriPerm = _oriReq ? await _oriReq.then(v => v).catch(() => 'error') : (S.oriPerm === 'error' ? 'error' : 'granted');
  S.motPerm = _motReq ? await _motReq.then(v => v).catch(() => 'error') : (S.motPerm === 'error' ? 'error' : 'granted');
  addSensorListeners();
  // 2) аудіо — ПІСЛЯ датчиків (його await не має передувати requestPermission).
  audioInit(); if (AC && AC.state === 'suspended') { try { await AC.resume(); } catch (e) {} }

  const l0 = bootLine('СИСТЕМА'); setLine(l0, 'ПАШЛА'); if (!REDUCED) await sleep(120);

  const l1 = bootLine('КАМЕРА');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 } }, audio: false });
    video.srcObject = stream; await video.play().catch(() => {}); S.camOk = true; setLine(l1, 'Є КАРТИНКА');
  } catch (e) { setLine(l1, 'ВІДМОВА — ЧОРНЕ ТЛО', 'warn'); }
  if (!REDUCED) await sleep(100);

  const l2 = bootLine('БАЧЕННЯ'); S.glOk = initGL(); applyVision(); setLine(l2, S.glOk ? 'WEBGL · 3 РЕЖИМИ' : 'CSS-FALLBACK', S.glOk ? 'ok' : 'warn');
  if (!REDUCED) await sleep(100);

  const l3 = bootLine('ГІРОСКОП'); const got = await waitOriEvent(1300);
  setLine(l3, got ? 'Є КОНТАКТ' : (S.oriPerm === 'denied' ? 'ДОЗВІЛ ВІДХИЛЕНО' : (S.oriPerm === 'granted' ? 'ТИША — ПЕРЕЗАВАНТАЖ' : 'ТИША — ATT ФЛАГ')), got ? 'ok' : (S.oriPerm === 'denied' ? 'err' : 'warn'));

  const l4 = bootLine('GPS'); startGPS(); setLine(l4, 'ШУКАЄМ СУПУТНИКИ…', 'warn'); if (!REDUCED) await sleep(100);

  const l5 = bootLine('СЕНСОР ЦІЛЕЙ'); setLine(l5, S.detOn ? 'РУХ+ТЕПЛО · ОНЛАЙН' : 'ВИМКНЕНО', S.detOn ? 'ok' : 'warn'); if (!REDUCED) await sleep(100);

  const l6 = bootLine('ГОТОВО'); setLine(l6, 'ТРИМАЙ ГОРИЗОНТ');

  lockWake(); S.booted = true; document.body.classList.add('booted');
  refreshHUDText(); setInterval(refreshHUDText, 250); requestAnimationFrame(frame);

  await sleep(REDUCED ? 150 : 550);
  const boot = $('boot'); boot.classList.add('off'); setTimeout(() => boot.remove(), 600);
}
$('armBtn').addEventListener('click', arm);

/* ═══════════════ СТАРТ ═══════════════ */
resize();
</script>
</body>
</html>
