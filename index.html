<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FPV HUD | REAL GYRO DATA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', 'Courier', monospace;
        }

        #camVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: grayscale(0.7) brightness(0.55) contrast(1.5) sepia(0.2) hue-rotate(85deg);
        }

        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,20,0,0.15) 0px, rgba(0,20,0,0.15) 2px, transparent 2px, transparent 5px);
            pointer-events: none;
            z-index: 10;
        }

        #hudCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 5;
            pointer-events: none;
        }

        .status-panel {
            position: fixed;
            bottom: 12px;
            left: 12px;
            right: 12px;
            z-index: 20;
            background: rgba(0, 10, 0, 0.75);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            border: 0.5px solid rgba(0,255,0,0.4);
            font-size: 9px;
            font-family: monospace;
            pointer-events: none;
            color: #0f0;
        }

        .status-left {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .permission-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(12px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 24px;
            font-family: monospace;
            color: #0f0;
            text-align: center;
            padding: 20px;
            transition: opacity 0.4s ease;
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 2px solid #0f0;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .status-panel { font-size: 7px; padding: 6px 12px; bottom: 8px; left: 8px; right: 8px; }
            .status-left { gap: 8px; }
        }
    </style>
</head>
<body>

<video id="camVideo" autoplay playsinline muted></video>
<div class="crt-overlay"></div>
<canvas id="hudCanvas"></canvas>
<div class="status-panel">
    <div class="status-left">
        <span>🎯 GYRO: <span id="gyroStatus">WAITING</span></span>
        <span>📷 CAM: <span id="camStatus">WAITING</span></span>
        <span>🎙️ MIC: <span id="micStatus">OFF</span></span>
    </div>
    <div>📐 REAL SENSOR DATA</div>
</div>
<div class="permission-overlay" id="permissionOverlay">
    <div class="loader"></div>
    <div style="font-size: 14px; max-width: 280px; text-align: center;">🔐 ДОСТУП К ДАТЧИКАМ<br>КАМЕРА • ГИРОСКОП</div>
    <div style="font-size: 10px; opacity:0.7;">FPV TACTICAL HUD | РЕАЛЬНЫЕ ДАННЫЕ</div>
</div>

<script>
    (function(){
        // Элементы
        const canvas = document.getElementById('hudCanvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('camVideo');
        const permissionOverlay = document.getElementById('permissionOverlay');
        const gyroStatusSpan = document.getElementById('gyroStatus');
        const camStatusSpan = document.getElementById('camStatus');
        const micStatusSpan = document.getElementById('micStatus');
        
        let width, height;
        let frame = 0;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();
        
        // ========== РЕАЛЬНЫЕ ДАННЫЕ ГИРОСКОПА ==========
        let pitch = 0;      // тангаж (вперёд/назад)
        let roll = 0;       // крен (влево/вправо)
        let yaw = 0;        // рыскание (компас)
        
        let gyroActive = false;
        let cameraActive = false;
        
        // Калибровка (обнуляем положение телефона при старте)
        let calibrationPitch = null;
        let calibrationRoll = null;
        
        // Телеметрия (реагирует на реальные наклоны)
        let speed = 120;
        let altitude = 3000;
        let battery = 25.2;
        let rssi = 85;
        
        // ========== 1. ГИРОСКОП - ТОЛЬКО РЕАЛЬНЫЕ ДАННЫЕ, БЕЗ ФЕЙКОВ ==========
        function onDeviceOrientation(event) {
            if (!gyroActive) return;
            
            // Получаем сырые значения от датчика
            let beta = event.beta;    // -180..180 (тангаж)
            let gamma = event.gamma;  // -90..90 (крен)
            let alpha = event.alpha;  // 0..360 (рыскание)
            
            if (beta === null || gamma === null) return;
            
            // КАЛИБРОВКА при первом получении данных
            if (calibrationPitch === null) {
                calibrationPitch = beta;
                calibrationRoll = gamma;
                console.log("Calibrated: pitch offset=" + calibrationPitch + " roll offset=" + calibrationRoll);
            }
            
            // РЕАЛЬНЫЕ углы относительно калибровки (без фильтров, без сглаживания)
            pitch = beta - calibrationPitch;
            roll = gamma - calibrationRoll;
            
            // Ограничиваем для корректного отображения
            pitch = Math.min(35, Math.max(-35, pitch));
            roll = Math.min(45, Math.max(-45, roll));
            
            if (alpha !== null) {
                yaw = alpha;
            }
            
            // Реальное влияние на телеметрию (наклон вперёд = разгон)
            let pitchEffect = pitch / 20;
            speed += pitchEffect * 0.5;
            speed = Math.min(450, Math.max(20, speed));
            
            // Влияние на высоту
            let altEffect = (Math.abs(roll) * 0.15) - (pitch * 0.1);
            altitude += altEffect * 0.5;
            altitude = Math.min(12000, Math.max(200, altitude));
            
            // Батарея и сигнал
            battery += (Math.random() - 0.5) * 0.01;
            battery = Math.min(28, Math.max(22, battery));
            rssi += (Math.random() - 0.5) * 0.3;
            rssi = Math.min(99, Math.max(40, rssi));
        }
        
        // Инициализация гироскопа с поддержкой iOS и Android
        function initGyro() {
            // Для Android: событие доступно сразу
            if (typeof DeviceOrientationEvent !== 'undefined') {
                // Проверяем, нужно ли разрешение (iOS)
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    // iOS: показываем запрос
                    DeviceOrientationEvent.requestPermission()
                        .then(permission => {
                            if (permission === 'granted') {
                                window.addEventListener('deviceorientation', onDeviceOrientation);
                                gyroActive = true;
                                gyroStatusSpan.innerText = "ACTIVE";
                                gyroStatusSpan.style.color = "#0f0";
                            } else {
                                gyroStatusSpan.innerText = "DENIED";
                                gyroStatusSpan.style.color = "#f66";
                                enableDemoMode();
                            }
                        })
                        .catch(err => {
                            console.error("Gyro error:", err);
                            gyroStatusSpan.innerText = "ERROR";
                            enableDemoMode();
                        });
                } else {
                    // Android / десктоп: подключаем сразу
                    window.addEventListener('deviceorientation', onDeviceOrientation);
                    gyroActive = true;
                    gyroStatusSpan.innerText = "ACTIVE";
                    gyroStatusSpan.style.color = "#0f0";
                    console.log("Gyro connected (Android mode)");
                }
            } else {
                gyroStatusSpan.innerText = "NOT SUPPORTED";
                enableDemoMode();
            }
        }
        
        // РЕЖИМ ДЕМО (только если гироскоп реально недоступен)
        let demoMode = false;
        function enableDemoMode() {
            demoMode = true;
            gyroActive = false;
            console.log("Demo mode active - gyro unavailable");
        }
        
        // Демо-симуляция (минимальная, только если нет гироскопа)
        function updateDemo() {
            if (!demoMode) return;
            pitch = Math.sin(Date.now() * 0.002) * 12;
            roll = Math.cos(Date.now() * 0.0025) * 8;
            yaw = (Date.now() * 0.05) % 360;
            speed += (Math.random() - 0.5) * 0.3;
            altitude += (Math.random() - 0.5) * 1;
        }
        
        // ========== 2. КАМЕРА ==========
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: "environment" } }
                });
                video.srcObject = stream;
                video.style.display = 'block';
                cameraActive = true;
                camStatusSpan.innerText = "ON";
                camStatusSpan.style.color = "#0f0";
            } catch(e) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                    video.style.display = 'block';
                    cameraActive = true;
                    camStatusSpan.innerText = "ON";
                    camStatusSpan.style.color = "#0f0";
                } catch(err) {
                    cameraActive = false;
                    camStatusSpan.innerText = "OFF";
                    camStatusSpan.style.color = "#f66";
                }
            }
        }
        
        // ========== 3. МИКРОФОН (опционально) ==========
        let micActive = false;
        async function initMicrophone() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                micActive = true;
                micStatusSpan.innerText = "ON";
                micStatusSpan.style.color = "#0f0";
                stream.getTracks().forEach(track => track.stop()); // просто проверка доступа
            } catch(e) {
                micActive = false;
                micStatusSpan.innerText = "OFF";
            }
        }
        
        // ========== ОТРИСОВКА HUD ==========
        function drawAttitude() {
            ctx.font = "bold 14px 'Courier New'";
            ctx.fillStyle = "#0f0";
            ctx.fillText(`PITCH ${pitch.toFixed(1)}°`, 18, 48);
            ctx.fillText(`ROLL ${roll.toFixed(1)}°`, 18, 78);
            ctx.fillText(`YAW ${Math.floor(yaw)}°`, 18, 108);
            ctx.fillText(`BAT ${battery.toFixed(1)}V`, 18, 138);
            
            ctx.fillStyle = `rgba(0,255,0,0.7)`;
            ctx.fillRect(18, 152, (rssi/100)*70, 7);
            ctx.strokeStyle = "#0f0";
            ctx.strokeRect(18, 152, 70, 7);
            ctx.fillStyle = "#0f0";
            ctx.fillText(`RSSI ${Math.floor(rssi)}%`, 18, 174);
        }
        
        function drawCompass() {
            let cx = width - 85;
            let cy = 80;
            let r = 55;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI*2);
            ctx.strokeStyle = "#0f0";
            ctx.stroke();
            
            for(let deg = 0; deg < 360; deg += 30) {
                let rad = (deg - yaw) * Math.PI/180;
                let x = cx + Math.sin(rad) * (r-10);
                let y = cy - Math.cos(rad) * (r-10);
                let label = deg===0 ? "N" : (deg===90 ? "E" : (deg===180 ? "S" : (deg===270 ? "W" : deg)));
                ctx.fillStyle = "#0f0";
                ctx.font = (deg%90===0) ? "bold 13px monospace" : "9px monospace";
                ctx.fillText(label, x-5, y+4);
            }
            
            ctx.beginPath();
            ctx.moveTo(cx, cy - r + 6);
            ctx.lineTo(cx-4, cy - r + 13);
            ctx.lineTo(cx+4, cy - r + 13);
            ctx.fillStyle = "#fa0";
            ctx.fill();
        }
        
        function drawTape(x, y, value, label, unit, alignRight) {
            ctx.font = "bold 11px monospace";
            ctx.fillStyle = "#0f0";
            ctx.fillText(label, alignRight ? x-40 : x+5, y-38);
            let step = 20;
            let startVal = Math.floor(value/step)*step - 60;
            for(let v = startVal; v <= startVal+120; v+= step){
                let ty = y + (value - v)*1.25;
                if(ty > 30 && ty < height-30){
                    ctx.beginPath();
                    ctx.moveTo(alignRight ? x-16 : x+16, ty);
                    ctx.lineTo(alignRight ? x : x+26, ty);
                    ctx.stroke();
                    ctx.fillText(Math.floor(v), alignRight ? x-38 : x+22, ty+4);
                }
            }
            ctx.fillStyle = "rgba(0,255,0,0.2)";
            ctx.fillRect(alignRight ? x-38 : x, y-9, 32, 18);
            ctx.fillStyle = "#0f0";
            ctx.font = "bold 18px monospace";
            ctx.fillText(Math.floor(value), alignRight ? x-28 : x+7, y+6);
            ctx.font = "8px monospace";
            ctx.fillText(unit, alignRight ? x-10 : x+35, y+4);
        }
        
        function drawHorizon() {
            ctx.save();
            ctx.translate(width/2, height/2 + 20);
            ctx.rotate(roll * Math.PI / 180);
            let pitchOffset = pitch * 2.2;
            ctx.beginPath();
            ctx.moveTo(-280, pitchOffset);
            ctx.lineTo(280, pitchOffset);
            ctx.lineWidth = 2;
            ctx.stroke();
            
            for(let ang = -30; ang <= 30; ang += 10) {
                let yOff = ang * 1.6 + pitchOffset;
                if(Math.abs(yOff) < 150) {
                    ctx.beginPath();
                    ctx.moveTo(ang===0 ? -50 : -28, yOff);
                    ctx.lineTo(ang===0 ? 50 : 28, yOff);
                    ctx.stroke();
                    ctx.fillStyle = "#0f0";
                    ctx.font = "9px monospace";
                    ctx.fillText(ang+"°", 58, yOff+4);
                    ctx.fillText(ang+"°", -76, yOff+4);
                }
            }
            ctx.restore();
            
            // Прицельная метка
            ctx.beginPath();
            ctx.moveTo(width/2 - 12, height/2 + 18);
            ctx.lineTo(width/2 - 3, height/2 + 18);
            ctx.moveTo(width/2 + 3, height/2 + 18);
            ctx.lineTo(width/2 + 12, height/2 + 18);
            ctx.moveTo(width/2, height/2 + 8);
            ctx.lineTo(width/2, height/2 + 28);
            ctx.stroke();
        }
        
        function drawBottom() {
            let time = new Date().toLocaleTimeString();
            ctx.font = "8px monospace";
            ctx.fillStyle = "#0f0";
            ctx.fillText(`${time} | ALT ${Math.floor(altitude)}m | SPD ${Math.floor(speed)}km/h`, 16, height-12);
            if(gyroActive) {
                ctx.fillText("⚡ LIVE GYRO", width-85, height-12);
            } else if(demoMode) {
                ctx.fillText("⚠️ DEMO MODE", width-85, height-12);
            }
        }
        
        function drawScanline() {
            ctx.fillStyle = 'rgba(0,255,0,0.03)';
            ctx.fillRect(0, (frame * 2.5) % height, width, 3);
        }
        
        // ========== АНИМАЦИЯ ==========
        function animate() {
            frame++;
            
            if(demoMode) {
                updateDemo();
            }
            
            ctx.clearRect(0, 0, width, height);
            drawHorizon();
            drawTape(width * 0.09, height/2, speed, "SPD", "km/h", false);
            drawTape(width * 0.91, height/2, altitude, "ALT", "m", true);
            drawAttitude();
            drawCompass();
            drawBottom();
            drawScanline();
            
            requestAnimationFrame(animate);
        }
        
        // ========== ЗАПУСК ==========
        async function start() {
            await initCamera();
            initMicrophone();
            initGyro();  // гироскоп запускается отдельно
            
            // Скрываем оверлей через 1 секунду
            setTimeout(() => {
                if(permissionOverlay) {
                    permissionOverlay.style.opacity = "0";
                    setTimeout(() => {
                        permissionOverlay.style.display = "none";
                    }, 500);
                }
            }, 1000);
        }
        
        start();
        animate();
        resize();
        
        // Для iOS: возобновление аудио не нужно, но оставим на всякий случай
        console.log("FPV HUD Started - waiting for gyro data");
    })();
</script>
</body>
</html>
