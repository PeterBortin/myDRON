<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>myDRON Tactical HUD v3.0</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        
        #loader {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: #0f0;
        }
        .logo-anim { font-size: 42px; font-weight: bold; letter-spacing: 12px; margin-bottom: 30px; text-shadow: 0 0 10px #0f0; animation: blink 0.1s infinite alternate; }
        .bar { width: 250px; height: 2px; background: #010; border: 1px solid #0f0; overflow: hidden; }
        .fill { width: 0%; height: 100%; background: #0f0; box-shadow: 0 0 10px #0f0; }
        @keyframes blink { 0% { opacity: 0.8; } 100% { opacity: 1; } }

        #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0.5; filter: grayscale(1) brightness(0.6) contrast(1.4); display: none; }
        canvas { position: relative; z-index: 5; display: block; filter: brightness(1.2) drop-shadow(0 0 2px #0f0); }
        .crt { position: fixed; inset: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%), linear-gradient(90deg, rgba(255,0,0,0.05), rgba(0,255,0,0.02), rgba(0,0,255,0.05)); background-size: 100% 3px, 3px 100%; pointer-events: none; z-index: 10; }

        .launch-btn {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 40, 0, 0.8); color: #0f0; border: 1px solid #0f0;
            padding: 15px 50px; font-size: 20px; font-weight: bold; cursor: pointer; z-index: 20;
            text-transform: uppercase; letter-spacing: 8px; backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

<div id="loader">
    <div class="logo-anim">myDRON</div>
    <div id="status" style="font-size: 12px; margin-bottom: 10px;">LOADING MODULES...</div>
    <div class="bar"><div id="fill" class="fill"></div></div>
</div>

<video id="cam" autoplay playsinline></video>
<div class="crt"></div>
<canvas id="hudCanvas"></canvas>
<button class="launch-btn" id="lBtn" onclick="startSystem()">Запуск</button>

<script>
    const canvas = document.getElementById('hudCanvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('cam');
    
    let w, h, frame = 0;
    let pitch = 0, roll = 0, yaw = 0;
    let isActive = false;
    let targets = [];

    // 1. Экран загрузки
    let prg = 0;
    const loadInt = setInterval(() => {
        prg += Math.random() * 4;
        document.getElementById('fill').style.width = Math.min(prg, 100) + '%';
        if(prg >= 100) {
            clearInterval(loadInt);
            setTimeout(() => document.getElementById('loader').style.display = 'none', 600);
        }
    }, 80);

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 2. Инициализация сенсоров и прицела
    async function startSystem() {
        isActive = true;
        document.getElementById('lBtn').style.display = 'none';
        
        try {
            const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = s; video.style.display = 'block';
        } catch(e) { console.warn("No Camera"); }

        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            const res = await DeviceOrientationEvent.requestPermission();
            if (res === 'granted') window.addEventListener('deviceorientation', updateSensors);
        } else { window.addEventListener('deviceorientation', updateSensors); }

        // Инициализация фиктивных целей для автозахвата
        targets = Array.from({length: 3}, () => ({
            x: Math.random() * w, y: Math.random() * h,
            vx: Math.random() * 2 - 1, vy: Math.random() * 2 - 1, id: Math.floor(Math.random()*999)
        }));
    }

    function updateSensors(e) {
        yaw = e.alpha || 0;    // Ось X
        pitch = e.beta || 0;   // Ось Y
        roll = e.gamma || 0;
    }

    // Отрисовка барабанов (X и Y)
    function drawTape(x, y, val, label, isRight = false) {
        const th = 260, tw = 65;
        ctx.strokeStyle = '#0f0';
        ctx.strokeRect(x, y - th/2, tw, th);
        ctx.save();
        ctx.rect(x, y - th/2, tw, th);
        ctx.clip();
        
        for(let i = -10; i <= 10; i++) {
            let v = Math.round(val + i * 10);
            let ty = y - (i * 40) + (val % 10) * 4;
            ctx.beginPath();
            ctx.moveTo(isRight ? x : x + tw, ty);
            ctx.lineTo(isRight ? x + 15 : x + tw - 15, ty);
            ctx.stroke();
            ctx.font = '11px monospace';
            ctx.fillStyle = '#0f0';
            ctx.fillText(v, isRight ? x + 20 : x + 5, ty + 4);
        }
        ctx.restore();
        ctx.fillText(label, x, y - th/2 - 10);
    }

    // Авиагоризонт
    function drawHorizon() {
        ctx.save();
        ctx.translate(w/2, h/2);
        ctx.rotate(roll * Math.PI / 180);
        ctx.translate(0, (pitch - 45) * 5); // Смещение для удобства
        
        ctx.strokeStyle = 'rgba(0, 255, 0, 0.6)';
        ctx.lineWidth = 2;
        for(let i = -6; i <= 6; i++) {
            if(i===0) {
                ctx.beginPath(); ctx.moveTo(-150, 0); ctx.lineTo(-40, 0); ctx.moveTo(40, 0); ctx.lineTo(150, 0); ctx.stroke();
            } else {
                let ty = i * 50;
                ctx.beginPath(); ctx.moveTo(-30, ty); ctx.lineTo(30, ty); ctx.stroke();
                ctx.fillText(i * 10, 40, ty + 4);
            }
        }
        ctx.restore();
    }

    // Система автозахвата
    function drawTargeting() {
        if(!isActive) return;
        targets.forEach(t => {
            t.x += t.vx; t.y += t.vy;
            if(t.x < 0 || t.x > w) t.vx *= -1;
            if(t.y < 0 || t.y > h) t.vy *= -1;

            const size = 50 + Math.sin(frame*0.1)*5;
            ctx.strokeStyle = '#f00';
            ctx.lineWidth = 1.5;
            
            // Углы рамки
            ctx.beginPath();
            ctx.moveTo(t.x - size/2, t.y - size/2 + 10); ctx.lineTo(t.x - size/2, t.y - size/2); ctx.lineTo(t.x - size/2 + 10, t.y - size/2);
            ctx.moveTo(t.x + size/2, t.y - size/2 + 10); ctx.lineTo(t.x + size/2, t.y - size/2); ctx.lineTo(t.x + size/2 - 10, t.y - size/2);
            ctx.moveTo(t.x - size/2, t.y + size/2 - 10); ctx.lineTo(t.x - size/2, t.y + size/2); ctx.lineTo(t.x - size/2 + 10, t.y + size/2);
            ctx.moveTo(t.x + size/2, t.y + size/2 - 10); ctx.lineTo(t.x + size/2, t.y + size/2); ctx.lineTo(t.x + size/2 - 10, t.y + size/2);
            ctx.stroke();

            // Линия захвата
            ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.moveTo(w/2, h/2); ctx.lineTo(t.x, t.y); ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.fillStyle = '#f00';
            ctx.font = '10px monospace';
            ctx.fillText(`LOCK: OBJT_${t.id}`, t.x + size/2 + 5, t.y - 10);
            ctx.fillText(`AZ: ${t.x.toFixed(0)}`, t.x + size/2 + 5, t.y + 5);
        });
    }

    function loop() {
        frame++;
        ctx.clearRect(0, 0, w, h);

        // Статичная сетка фона
        ctx.strokeStyle = 'rgba(0, 50, 0, 0.2)';
        ctx.lineWidth = 1;
        for(let i=0; i<w; i+=60) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,h); ctx.stroke(); }
        for(let i=0; i<h; i+=60) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(w,i); ctx.stroke(); }

        drawHorizon();
        
        // Барабаны: Направление (X) и Тангаж (Y)
        drawTape(w * 0.1, h/2, yaw, "DIR_X");
        drawTape(w * 0.82, h/2, pitch, "DIR_Y", true);

        // Центральный прицел
        ctx.strokeStyle = isActive ? '#f00' : '#0f0';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(w/2 - 20, h/2); ctx.lineTo(w/2 + 20, h/2);
        ctx.moveTo(w/2, h/2 - 20); ctx.lineTo(w/2, h/2 + 20);
        ctx.stroke();
        ctx.strokeRect(w/2 - 60, h/2 - 40, 120, 80);

        drawTargeting();

        // Телеметрия
        ctx.fillStyle = '#0f0';
        ctx.font = '12px monospace';
        ctx.fillText(`OS: myDRON.v3 // ${new Date().toLocaleTimeString()}`, 20, 30);
        ctx.fillText(`SENSORS: ${isActive ? 'ONLINE' : 'WAITING'}`, 20, 45);

        // Сканирующая полоса
        ctx.fillStyle = 'rgba(0, 255, 0, 0.05)';
        ctx.fillRect(0, (frame * 3) % h, w, 4);

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
