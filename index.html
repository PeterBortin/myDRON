<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FPV COMMAND CENTER v7.0</title>
    <style>
        :root { --color: #00ff41; --bg: rgba(0, 50, 0, 0.2); }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        
        #cam { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; 
               filter: brightness(0.6) contrast(1.4) sepia(0.3) hue-rotate(85deg); }
        
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
                   background: radial-gradient(circle, transparent 20%, #000 150%);
                   display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .terminal { background: #000; border: 1px solid var(--color); padding: 30px; box-shadow: 0 0 20px var(--color); color: var(--color); text-align: center; }
        
        .btn { background: var(--color); color: #000; border: none; padding: 15px 40px; font-weight: bold; 
               font-family: inherit; cursor: pointer; margin-top: 20px; letter-spacing: 2px; }

        /* Кнопка сброса горизонтали */
        #reset-btn {
            position: fixed; bottom: 20px; right: 20px; z-index: 50;
            background: rgba(0,0,0,0.6); border: 1px solid var(--color); color: var(--color);
            padding: 10px; font-size: 10px; cursor: pointer; display: none;
        }

        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 15;
                     background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 255, 0, 0.05) 50%), 
                                 linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
                     background-size: 100% 4px, 3px 100%; pointer-events: none; }
    </style>
</head>
<body>

<video id="cam" autoplay playsinline muted webkit-playsinline></video>
<div class="scanlines"></div>
<canvas id="canvas"></canvas>

<button id="reset-btn" onclick="resetHorizon()">RESET HORIZON</button>

<div id="boot" class="overlay">
    <div class="terminal">
        <h1 style="font-size: 18px;">[ SYSTEM INITIALIZATION ]</h1>
        <p style="font-size: 10px; margin: 10px 0;">SENSORS: STANDBY | LINK: DISCONNECTED</p>
        <button class="btn" onclick="boot()">ENGAGE SYSTEM</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('cam');
    
    let state = { 
        p: 0, r: 0, h: 0, 
        offsetP: 0, offsetR: 0, // Для калибровки
        s: 142, a: 850, batt: 24.4, active: false, frame: 0 
    };

    function boot() {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(s => { video.srcObject = s; video.play(); })
            .catch(e => alert("CAM ERR: " + e));

        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission()
                .then(res => { if(res === 'granted') window.addEventListener('deviceorientation', handleGyro); })
                .catch(e => alert("GYRO ERR: " + e));
        } else {
            window.addEventListener('deviceorientation', handleGyro);
        }

        document.getElementById('boot').style.display = 'none';
        document.getElementById('reset-btn').style.display = 'block';
        state.active = true;
        animate();
    }

    function handleGyro(e) {
        // На iOS beta (pitch) идет от -180 до 180, gamma (roll) от -90 до 90
        // Применяем калибровку
        state.p = e.beta - state.offsetP;
        state.r = e.gamma - state.offsetR;
        state.h = e.webkitCompassHeading || e.alpha || 0;
    }

    function resetHorizon() {
        // Запоминаем текущее положение как "0"
        // Нам нужно вычесть текущее смещение, чтобы горизонт встал в центр
        // Но так как beta обычно ~90 когда телефон вертикально, мы калибруем под текущий хват
        state.offsetP = state.p + state.offsetP;
        state.offsetR = state.r + state.offsetR;
    }

    function drawTape(x, y, value, label, side) {
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 2;
        
        ctx.strokeRect(side === 'L' ? -40 : 0, -150, 40, 300);
        ctx.clip(new Path2D(`M ${side === 'L' ? -40 : 0} -150 h 40 v 300 h -40 Z`));

        let start = Math.floor(value / 10) * 10 - 50;
        for (let i = start; i <= start + 100; i += 10) {
            let yPos = (value - i) * 6;
            ctx.beginPath();
            ctx.moveTo(side === 'L' ? -10 : 0, yPos);
            ctx.lineTo(side === 'L' ? 0 : 10, yPos);
            ctx.stroke();
            ctx.font = "10px monospace";
            ctx.fillText(i, side === 'L' ? -35 : 15, yPos + 4);
        }
        
        ctx.restore();
        ctx.fillStyle = "rgba(0,255,0,0.2)";
        ctx.fillRect(side === 'L' ? x-45 : x-5, y-15, 50, 30);
        ctx.fillStyle = "#0f0";
        ctx.font = "bold 14px monospace";
        ctx.fillText(Math.round(value), side === 'L' ? x-35 : x+5, y+5);
        ctx.font = "10px monospace";
        ctx.fillText(label, side === 'L' ? x-35 : x+5, y-160);
    }

    function drawHorizon() {
        const cx = canvas.width/2, cy = canvas.height/2;
        ctx.save();
        ctx.translate(cx, cy);
        
        // Вращаем HUD согласно крену (roll)
        ctx.rotate(state.r * Math.PI / 180);
        
        // Масштабируем тангаж: 1 градус = 10 пикселей (чувствительность)
        // Для iOS когда телефон вертикально, beta ~90. 
        // Если смотрим прямо, pitch должен быть 0.
        let pY = state.p * 10; 
        
        // Ограничиваем отрисовку, чтобы горизонт не улетал слишком далеко
        ctx.strokeStyle = '#0f0';
        
        // Главная линия горизонта
        ctx.beginPath();
        ctx.lineWidth = 3;
        ctx.moveTo(-200, pY); ctx.lineTo(-60, pY);
        ctx.moveTo(60, pY); ctx.lineTo(200, pY);
        ctx.stroke();

        // Лестница тангажа (шкала высоты угла)
        ctx.lineWidth = 1;
        ctx.font = "10px monospace";
        ctx.textAlign = "center";
        for(let i=-90; i<=90; i+=10) {
            if(i === 0) continue;
            let y = pY - (i * 10);
            
            // Рисуем только те деления, что видны в радиусе 200px
            if (Math.abs(y) < 250) {
                ctx.beginPath();
                // Положительные углы (вверх) - сплошные, отрицательные - пунктир
                if (i < 0) ctx.setLineDash([5, 5]); else ctx.setLineDash([]);
                
                ctx.moveTo(-40, y); ctx.lineTo(40, y);
                ctx.stroke();
                ctx.setLineDash([]); // Сброс пунктира
                
                ctx.fillText(i, 55, y + 4);
                ctx.fillText(i, -55, y + 4);
            }
        }
        ctx.restore();
    }

    function animate() {
        if(!state.active) return;
        state.frame++;
        const w = canvas.width = window.innerWidth;
        const h = canvas.height = window.innerHeight;
        
        ctx.clearRect(0,0,w,h);
        ctx.strokeStyle = '#0f0';
        ctx.fillStyle = '#0f0';

        // 1. Горизонт (теперь откалиброван и отзывчив)
        drawHorizon();

        // 2. Ленты (Speed & Altitude)
        drawTape(100, h/2, state.s, "SPD", "L");
        drawTape(w-100, h/2, state.a, "ALT", "R");

        // 3. Центральный прицел (Static)
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(w/2-30, h/2); ctx.lineTo(w/2-10, h/2);
        ctx.moveTo(w/2+30, h/2); ctx.lineTo(w/2+10, h/2);
        ctx.moveTo(w/2, h/2-10); ctx.lineTo(w/2, h/2-25);
        ctx.stroke();
        // Центральная точка
        ctx.fillRect(w/2-1, h/2-1, 2, 2);

        // 4. Компас (вверху)
        ctx.font = "16px monospace";
        ctx.textAlign = "center";
        ctx.fillText("HDG: " + Math.round(state.h).toString().padStart(3, '0') + "°", w/2, 60);

        // 5. Статус бары (внизу)
        ctx.textAlign = "left";
        ctx.font = "10px monospace";
        ctx.fillText(`BATT: ${state.batt}V`, 30, h-30);
        ctx.fillText(`SAT: 12`, 30, h-50);
        ctx.fillText(`REC ●`, w-80, h-30);

        // Имитация динамики (оставляем как в ТЗ)
        state.s += Math.sin(state.frame/50) * 0.5;
        state.a += Math.cos(state.frame/100) * 0.2;

        requestAnimationFrame(animate);
    }
</script>
</body>
</html>
