<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ULTIMATE FPV HUD</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #0f0; font-family: monospace; overflow: hidden; }
        #v { position: fixed; top:0; left:0; width:100%; height:100%; object-fit: cover; z-index:1; }
        #c { position: absolute; top:0; left:0; width:100%; height:100%; z-index:10; pointer-events:none; }
        #ui { position: fixed; top:0; left:0; width:100%; height:100%; z-index:100; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .b { border: 2px solid #0f0; background: none; color: #0f0; padding: 20px; font-size: 20px; cursor: pointer; }
        #debug { position: fixed; top: 10px; left: 10px; z-index: 200; font-size: 10px; background: rgba(0,0,0,0.5); pointer-events: none; }
    </style>
</head>
<body>

<div id="debug">LOG: STANDBY...</div>
<video id="v" autoplay playsinline muted webkit-playsinline></video>
<canvas id="c"></canvas>

<div id="ui">
    <div style="margin-bottom: 20px; text-align: center;">
        <h2>FPV SYSTEM BOOT</h2>
        <p>iOS/Android Sensor Access</p>
    </div>
    <button class="b" id="go">INITIALIZE LINK</button>
</div>

<script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('v');
    const debug = document.getElementById('debug');
    const ui = document.getElementById('ui');

    let data = { p: 0, r: 0, h: 0, s: 0, a: 120, lat: 0, lon: 0 };

    function log(msg) { debug.innerText += "\n" + msg; }

    // Главная функция запуска
    document.getElementById('go').addEventListener('click', async function() {
        log("INIT SEQUENCE START...");

        // 1. Пытаемся запустить камеру
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            video.play();
            log("CAM: OK");
        } catch(e) { log("CAM: ERROR " + e.message); }

        // 2. Датчики движения (iOS 13+)
        if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
                const permission = await DeviceOrientationEvent.requestPermission();
                if (permission === 'granted') {
                    window.addEventListener('deviceorientation', updateSensors, true);
                    log("GYRO: GRANTED");
                } else { log("GYRO: DENIED"); }
            } catch(e) { log("GYRO: REQ ERROR"); }
        } else {
            window.addEventListener('deviceorientation', updateSensors, true);
            log("GYRO: ANDROID/OLD IOS OK");
        }

        // 3. Геолокация (для скорости и координат)
        navigator.geolocation.watchPosition((pos) => {
            data.s = pos.coords.speed || 0;
            data.lat = pos.coords.latitude;
            data.lon = pos.coords.longitude;
            log("GPS: ACTIVE");
        }, (err) => log("GPS: OFF"), { enableHighAccuracy: true });

        ui.style.display = 'none';
        requestAnimationFrame(loop);
    });

    function updateSensors(e) {
        // Крен и тангаж
        data.p = e.beta; 
        data.r = e.gamma;
        // Направление (iOS использует webkitCompassHeading)
        data.h = e.webkitCompassHeading || e.alpha || 0;
    }

    function loop() {
        const w = canvas.width = window.innerWidth;
        const h = canvas.height = window.innerHeight;
        const cx = w/2, cy = h/2;

        ctx.clearRect(0,0,w,h);
        ctx.strokeStyle = '#0f0';
        ctx.fillStyle = '#0f0';
        ctx.lineWidth = 1.5;

        // Рисуем горизонт
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(data.r * Math.PI / 180);
        
        let pitchShift = data.p * 5;
        
        // Линия горизонта
        ctx.beginPath();
        ctx.moveTo(-200, pitchShift); ctx.lineTo(-40, pitchShift);
        ctx.moveTo(40, pitchShift); ctx.lineTo(200, pitchShift);
        ctx.stroke();

        // Шкала
        for(let i=-50; i<=50; i+=10) {
            if(i===0) continue;
            let y = pitchShift - (i * 5);
            ctx.globalAlpha = 0.3;
            ctx.beginPath(); ctx.moveTo(-20, y); ctx.lineTo(20, y); ctx.stroke();
            ctx.font = "10px monospace";
            ctx.fillText(i, 25, y+4);
        }
        ctx.restore();

        // Данные по бокам
        ctx.globalAlpha = 1;
        ctx.font = "14px monospace";
        
        // Левая панель (Скорость)
        ctx.strokeRect(20, cy-60, 50, 120);
        ctx.fillText("SPD", 25, cy-70);
        ctx.fillText(Math.round(data.s * 3.6), 35, cy+5); // м/с в км/ч

        // Правая панель (Высота)
        ctx.strokeRect(w-70, cy-60, 50, 120);
        ctx.fillText("ALT", w-65, cy-70);
        ctx.fillText(Math.round(data.a), w-60, cy+5);

        // Компас (Верх)
        ctx.fillText("HDG: " + Math.round(data.h) + "°", cx-30, 40);
        ctx.beginPath(); ctx.moveTo(cx, 45); ctx.lineTo(cx, 60); ctx.stroke();

        // Координаты (Низ)
        ctx.font = "9px monospace";
        ctx.fillText(`LAT: ${data.lat.toFixed(4)} LON: ${data.lon.toFixed(4)}`, 20, h-20);

        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
