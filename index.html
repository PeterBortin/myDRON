<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FPV SYSTEM | MIL-SPEC</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        
        /* Видео с фиксами для iOS */
        #cam {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
            filter: brightness(0.8) contrast(1.2) sepia(0.2) hue-rotate(80deg);
        }

        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }

        /* Оверлей запуска */
        #boot {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #0f0; text-align: center;
        }

        .btn-init {
            border: 1px solid #0f0; background: rgba(0,255,0,0.1); color: #0f0;
            padding: 20px 50px; font-size: 16px; cursor: pointer; font-family: inherit;
            box-shadow: 0 0 15px rgba(0,255,0,0.2);
        }

        #log { position: fixed; top: 10px; left: 10px; color: #0f0; font-size: 10px; z-index: 10; pointer-events: none; }
    </style>
</head>
<body>

<div id="log">SYSTEM READY. AWAITING LINK...</div>

<div id="boot">
    <h1 style="letter-spacing: 5px;">FPV HUD V5.0</h1>
    <div style="margin: 20px; font-size: 12px; color: #0a0;">[SECURE LINK REQUIRED]</div>
    <button class="btn-init" id="startBtn">INITIALIZE SYSTEM</button>
</div>

<video id="cam" autoplay playsinline muted webkit-playsinline></video>
<canvas id="hud"></canvas>

<script>
    const log = (msg) => { document.getElementById('log').innerText += "\n" + msg; console.log(msg); };
    const canvas = document.getElementById('hud');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('cam');
    
    let state = { p: 0, r: 0, h: 0, active: false };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    document.getElementById('startBtn').addEventListener('click', async () => {
        log("STARTING SENSORS...");
        
        // 1. КАМЕРА
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment" }, 
                audio: false 
            });
            video.srcObject = stream;
            // Важно для iOS: явно вызвать play() после установки srcObject
            await video.play();
            log("CAMERA: OK");
        } catch (e) {
            log("CAMERA: FAIL - " + e.message);
        }

        // 2. ГИРОСКОП (iOS 13+)
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
                const res = await DeviceOrientationEvent.requestPermission();
                if (res === 'granted') {
                    window.addEventListener('deviceorientation', updateMotion, true);
                    log("GYRO: GRANTED");
                }
            } catch (e) {
                log("GYRO: ERROR");
            }
        } else {
            window.addEventListener('deviceorientation', updateMotion, true);
            log("GYRO: LEGACY OK");
        }

        state.active = true;
        document.getElementById('boot').style.display = 'none';
        animate();
    });

    function updateMotion(e) {
        // Кроссплатформенный расчет углов
        state.p = e.beta;  // Pitch
        state.r = e.gamma; // Roll
        // Компас специально для iOS
        state.h = e.webkitCompassHeading || e.alpha || 0;
    }

    function draw() {
        const w = canvas.width, h = canvas.height;
        const cx = w/2, cy = h/2;
        ctx.clearRect(0, 0, w, h);

        ctx.strokeStyle = '#0f0';
        ctx.fillStyle = '#0f0';
        ctx.lineWidth = 2;

        // --- Искусственный горизонт ---
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(state.r * Math.PI / 180);
        
        let pOffset = state.p * 5;
        
        ctx.beginPath();
        ctx.moveTo(-w/3, pOffset); ctx.lineTo(-50, pOffset);
        ctx.moveTo(50, pOffset); ctx.lineTo(w/3, pOffset);
        ctx.stroke();
        
        // Штрихи тангажа
        ctx.font = '10px monospace';
        for(let i=-40; i<=40; i+=10) {
            let y = pOffset - (i * 5);
            ctx.globalAlpha = 0.4;
            ctx.beginPath(); ctx.moveTo(-30, y); ctx.lineTo(30, y); ctx.stroke();
            ctx.fillText(i, 35, y + 4);
        }
        ctx.restore();

        // --- Статичный прицел ---
        ctx.globalAlpha = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, 10, 0, Math.PI*2);
        ctx.moveTo(cx-20, cy); ctx.lineTo(cx-10, cy);
        ctx.moveTo(cx+20, cy); ctx.lineTo(cx+10, cy);
        ctx.stroke();

        // --- Компас ---
        ctx.fillText("HDG: " + Math.round(state.h).toString().padStart(3, '0'), cx - 25, 50);
        
        // --- Декоративные элементы по углам ---
        ctx.strokeRect(20, 20, 60, 20);
        ctx.fillText("VCC: 24.1V", 25, 34);
        ctx.fillText("RSSI: 99%", 25, 55);
    }

    function animate() {
        draw();
        requestAnimationFrame(animate);
    }
</script>
</body>
</html>
