<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FPV Combat HUD | Sensor Link + Target Lock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', 'Courier', 'Fira Code', monospace;
        }

        #camVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: grayscale(0.75) brightness(0.55) contrast(1.45) sepia(0.25) hue-rotate(80deg);
            display: none;
        }

        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,20,0,0.2) 0px, rgba(0,20,0,0.2) 2px, transparent 2px, transparent 4px), 
                        linear-gradient(90deg, rgba(0,255,0,0.03) 0%, rgba(0,0,0,0.1) 50%, rgba(0,255,0,0.03) 100%);
            pointer-events: none;
            z-index: 10;
            mix-blend-mode: overlay;
        }

        #hudCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 5;
            pointer-events: none;
        }

        .controls {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            gap: 14px;
            background: rgba(0, 8, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 10px 22px;
            border-radius: 50px;
            border: 1px solid rgba(0, 255, 0, 0.6);
            box-shadow: 0 0 18px rgba(0, 255, 0, 0.25);
            pointer-events: auto;
        }

        button {
            background: rgba(0, 20, 0, 0.9);
            color: #0f0;
            border: 1px solid #0f0;
            padding: 8px 18px;
            text-transform: uppercase;
            font-size: 12px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            letter-spacing: 1.5px;
            cursor: pointer;
            border-radius: 40px;
            transition: all 0.2s ease;
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.3);
        }

        button:active {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 18px #0f0;
            transform: scale(0.96);
        }

        .status-bar {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 25;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(5px);
            padding: 5px 12px;
            border-radius: 20px;
            border-left: 3px solid #0f0;
            font-size: 10px;
            font-family: monospace;
            color: #0f0;
            pointer-events: none;
        }
        
        @media (max-width: 700px) {
            button { padding: 6px 12px; font-size: 9px; }
            .controls { gap: 8px; padding: 8px 14px; bottom: 16px; }
            .status-bar { font-size: 8px; top: 6px; left: 6px; }
        }
    </style>
</head>
<body>

<video id="camVideo" autoplay playsinline muted></video>
<div class="crt-overlay"></div>
<canvas id="hudCanvas"></canvas>
<div class="controls">
    <button id="sensorBtn">⚡ LINK SENSORS</button>
    <button id="alertBtn">🎯 TARGET LOCK</button>
    <button id="resetBtn">🔍 OBJECT SCAN</button>
</div>
<div class="status-bar" id="sysStatus">⛁ SYSTEM INIT | GYRO: OFF</div>

<script>
    (function(){
        // ----- Элементы -----
        const canvas = document.getElementById('hudCanvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('camVideo');
        const sensorBtn = document.getElementById('sensorBtn');
        const alertBtn = document.getElementById('alertBtn');
        const resetBtn = document.getElementById('resetBtn');
        const sysStatus = document.getElementById('sysStatus');
        
        // ----- Размеры -----
        let width, height;
        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', () => { resizeCanvas(); });
        resizeCanvas();
        
        // ----- Основные переменные телеметрии -----
        let frame = 0;
        let pitch = 0;          // тангаж
        let roll = 0;           // крен
        let yaw = 0;            // рыскание (0-360)
        let speed = 126.4;      
        let altitude = 7820;    
        let batteryVoltage = 24.8;
        let rssi = 87;
        
        // ----- Флаги и датчики -----
        let sensorsLinked = false;
        let cameraActive = false;
        let micActive = false;
        let alertMode = false;      // флаг тревоги / целеуказания
        
        // ----- НОВЫЕ ФУНКЦИОНАЛЫ: обнаружение объектов и захват цели -----
        let objectDetectionActive = false;    // анимированная рамка поиска объектов
        let objectScanProgress = 0;            // 0..100 для анимации сканирования
        let targetLocked = false;              // захват цели (активный трекинг)
        let targetX = 0, targetY = 0;          // координаты захваченной цели (относительно центра экрана)
        let lockPulse = 0;
        
        // ----- Гироскоп + калибровка (плавная фильтрация) -----
        let deviceOrientationSupported = false;
        let calibrateOffset = { beta: 0, gamma: 0 };
        let isCalibrated = false;
        
        // Плавные значения pitch/roll (фильтр низких частот)
        let smoothPitch = 0, smoothRoll = 0;
        
        // ----- Микрофон для аудио-реактивности (опционально) -----
        let audioContext = null;
        let micStream = null;
        let audioAnalyser = null;
        let audioDataArray = null;
        let micLevel = 0;
        
        // ========== 1. КАМЕРА (FPV) ==========
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: "environment" } },
                    audio: false 
                });
                video.srcObject = stream;
                video.style.display = 'block';
                cameraActive = true;
                sysStatus.innerHTML = "📷 FPV ACTIVE | GYRO: " + (sensorsLinked ? "ON" : "OFF");
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = fallbackStream;
                    video.style.display = 'block';
                    cameraActive = true;
                } catch (e) { cameraActive = false; }
            }
        }
        
        // ========== 2. ГИРОСКОП (плавная обработка без рывков) ==========
        function handleOrientation(event) {
            if (!sensorsLinked) return;
            let beta = event.beta;
            let gamma = event.gamma;
            let alpha = event.alpha;
            if (beta === null || gamma === null) return;
            
            if (!isCalibrated && sensorsLinked) {
                calibrateOffset.beta = beta;
                calibrateOffset.gamma = gamma;
                isCalibrated = true;
            }
            let rawPitch = (beta - calibrateOffset.beta) * 0.85;
            let rawRoll = (gamma - calibrateOffset.gamma) * 1.0;
            rawPitch = Math.min(32, Math.max(-32, rawPitch));
            rawRoll = Math.min(38, Math.max(-38, rawRoll));
            
            // Фильтр экспоненциального сглаживания (убираем рывки)
            smoothPitch = smoothPitch * 0.85 + rawPitch * 0.15;
            smoothRoll = smoothRoll * 0.85 + rawRoll * 0.15;
            pitch = smoothPitch;
            roll = smoothRoll;
            
            if (alpha !== null) yaw = alpha;
            
            // Динамическое влияние на скорость/высоту (плавно)
            if (sensorsLinked) {
                let pitchEffect = pitch / 28;
                speed += pitchEffect * 0.28 + (Math.random() - 0.5) * 0.12;
                speed = Math.min(430, Math.max(18, speed));
                let altEffect = (Math.abs(roll) * 0.15) - (pitch * 0.08);
                altitude += altEffect * 0.4 + (Math.random() - 0.5) * 0.9;
                altitude = Math.min(13800, Math.max(110, altitude));
            }
        }
        
        // Инициализация гироскопа с поддержкой iOS
        async function initGyroscope() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                sensorBtn.innerText = "⚡ REQUEST GYRO";
                sensorBtn.onclick = async () => {
                    try {
                        const permission = await DeviceOrientationEvent.requestPermission();
                        if (permission === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            sensorsLinked = true;
                            isCalibrated = false;
                            sensorBtn.innerText = "🔗 GYRO ACTIVE";
                            sysStatus.innerHTML = "📷 FPV | GYRO: ONLINE";
                            if (!cameraActive) initCamera();
                            initMicrophone();
                        } else { sensorsLinked = false; }
                    } catch(e) { console.warn(e); }
                };
            } else {
                sensorBtn.onclick = () => {
                    window.addEventListener('deviceorientation', handleOrientation);
                    sensorsLinked = true;
                    isCalibrated = false;
                    sensorBtn.innerText = "🔗 GYRO ACTIVE";
                    sysStatus.innerHTML = "📷 FPV | GYRO: ONLINE";
                    if (!cameraActive) initCamera();
                    initMicrophone();
                };
            }
        }
        
        // ========== 3. МИКРОФОН (опционально, без рывков) ==========
        async function initMicrophone() {
            if (micActive) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                micStream = stream;
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                audioAnalyser = audioContext.createAnalyser();
                audioAnalyser.fftSize = 256;
                source.connect(audioAnalyser);
                audioDataArray = new Uint8Array(audioAnalyser.frequencyBinCount);
                micActive = true;
                if (audioContext.state === 'suspended') await audioContext.resume();
            } catch(err) { micActive = false; }
        }
        
        function updateMicLevel() {
            if (!micActive || !audioAnalyser || !audioDataArray) { micLevel = 0; return; }
            audioAnalyser.getByteFrequencyData(audioDataArray);
            let sum = 0;
            for (let i = 0; i < audioDataArray.length; i++) sum += audioDataArray[i];
            let avg = sum / (audioDataArray.length || 1);
            micLevel = Math.min(1, avg / 170);
            if (sensorsLinked && micActive && micLevel > 0.12) {
                speed += micLevel * 0.35;
                speed = Math.min(450, speed);
            }
        }
        
        // ========== 4. СИМУЛЯЦИЯ ЕСЛИ ДАТЧИКИ НЕ ПОДКЛЮЧЕНЫ (плавно) ==========
        function updateSimulatedData() {
            if (!sensorsLinked) {
                smoothPitch = smoothPitch * 0.96 + (Math.sin(frame * 0.009) * 6 + Math.cos(frame * 0.005) * 2) * 0.04;
                smoothRoll = smoothRoll * 0.96 + (Math.sin(frame * 0.011) * 4.5 + Math.cos(frame * 0.007) * 2) * 0.04;
                pitch = smoothPitch;
                roll = smoothRoll;
                yaw = (frame * 0.35) % 360;
                speed += (Math.sin(frame * 0.015) * 0.22) + (Math.random() - 0.5) * 0.3;
                altitude += (Math.sin(frame * 0.007) * 0.9) + (Math.random() - 0.5) * 1.1;
            }
            speed = Math.min(520, Math.max(12, speed));
            altitude = Math.min(14000, Math.max(90, altitude));
            batteryVoltage = Math.min(28.5, Math.max(21.0, batteryVoltage + (Math.random() - 0.5)*0.01));
            rssi = Math.min(100, Math.max(32, rssi + (Math.random() - 0.5)*0.4));
            if (alertMode) rssi = Math.max(38, rssi - 0.2);
        }
        
        // ========== НОВАЯ ЛОГИКА: Обнаружение объектов (анимированная рамка) ==========
        function startObjectScan() {
            objectDetectionActive = true;
            objectScanProgress = 0;
            targetLocked = false;   // сброс захвата цели при новом сканировании
            alertMode = false;
            alertBtn.style.borderColor = "#0f0";
            alertBtn.style.boxShadow = "0 0 5px #0f0";
        }
        
        // ========== ЗАХВАТ ЦЕЛИ (TARGET LOCK) ==========
        function engageTargetLock() {
            if (!objectDetectionActive && !targetLocked) {
                // Если нет активного сканирования, запускаем быстрое обнаружение с захватом
                objectDetectionActive = true;
                objectScanProgress = 0;
                targetLocked = false;
            }
            // Через небольшую задержку "захватываем" случайную цель в области HUD
            // Эмулируем обнаружение цели в центре поля зрения
            setTimeout(() => {
                if (objectDetectionActive || !targetLocked) {
                    // Генерируем координаты цели относительно центра ( -150..150 по X и Y )
                    targetX = (Math.random() - 0.5) * 280;
                    targetY = (Math.random() - 0.5) * 180 - 20;
                    targetLocked = true;
                    objectDetectionActive = false;   // сканирование завершено, цель захвачена
                    alertMode = true;                 // Включаем режим боевой тревоги
                    alertBtn.style.borderColor = "#f44";
                    alertBtn.style.boxShadow = "0 0 12px #f44";
                    sysStatus.innerHTML = "🎯 TARGET LOCKED | ENGAGED";
                }
            }, 280);
        }
        
        // Обновление анимации сканирования (прогресс)
        function updateObjectScan() {
            if (objectDetectionActive) {
                objectScanProgress += 2.2;
                if (objectScanProgress >= 100) {
                    objectDetectionActive = false;
                    // По завершению скана: автоматический захват цели в зоне обзора
                    targetX = (Math.random() - 0.5) * 300;
                    targetY = (Math.random() - 0.5) * 200 - 20;
                    targetLocked = true;
                    alertMode = true;
                    alertBtn.style.borderColor = "#f44";
                    alertBtn.style.boxShadow = "0 0 12px #f44";
                    sysStatus.innerHTML = "⚠️ OBJECT DETECTED | LOCK ACQUIRED";
                }
            }
        }
        
        // Анимированная рамка сканирования / захваченной цели
        function drawTargetingFrame() {
            if (objectDetectionActive) {
                let scanRadius = 55 + (Math.sin(frame * 0.15) * 8);
                let angle = (frame * 4) % 360;
                ctx.save();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = `rgba(0, 255, 200, ${0.6 + Math.sin(frame*0.2)*0.3})`;
                ctx.lineWidth = 2.5;
                let centerX = width/2;
                let centerY = height/2 - 20;
                // Круг сканирования
                ctx.beginPath();
                ctx.arc(centerX, centerY, scanRadius, 0, Math.PI*2);
                ctx.stroke();
                // Прогресс-бар сканирования
                ctx.beginPath();
                let progressAngle = (objectScanProgress / 100) * Math.PI * 2;
                ctx.arc(centerX, centerY, scanRadius+5, -Math.PI/2, -Math.PI/2 + progressAngle);
                ctx.stroke();
                // Текст сканирования
                ctx.font = "bold 12px monospace";
                ctx.fillStyle = "#0f0";
                ctx.fillText(`SCAN: ${Math.floor(objectScanProgress)}%`, centerX-40, centerY - scanRadius-8);
                ctx.fillText("🔍 SEARCHING", centerX-50, centerY + scanRadius+12);
                ctx.restore();
            }
            
            if (targetLocked && !objectDetectionActive) {
                // Анимированный прицел захвата цели с пульсацией
                lockPulse = (lockPulse + 0.12) % (Math.PI*2);
                let pulseScale = 0.7 + Math.sin(lockPulse * 3) * 0.2;
                let tx = width/2 + targetX;
                let ty = height/2 + targetY - 15;
                ctx.save();
                ctx.strokeStyle = "#f44";
                ctx.lineWidth = 2.2;
                ctx.shadowBlur = 0;
                // Внешний квадрат
                let size = 38 * pulseScale;
                ctx.strokeRect(tx - size/2, ty - size/2, size, size);
                // Угловые маркеры
                ctx.beginPath();
                ctx.moveTo(tx - size/2 - 6, ty - size/2);
                ctx.lineTo(tx - size/2, ty - size/2);
                ctx.lineTo(tx - size/2, ty - size/2 - 6);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(tx + size/2 + 6, ty - size/2);
                ctx.lineTo(tx + size/2, ty - size/2);
                ctx.lineTo(tx + size/2, ty - size/2 - 6);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(tx - size/2 - 6, ty + size/2);
                ctx.lineTo(tx - size/2, ty + size/2);
                ctx.lineTo(tx - size/2, ty + size/2 + 6);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(tx + size/2 + 6, ty + size/2);
                ctx.lineTo(tx + size/2, ty + size/2);
                ctx.lineTo(tx + size/2, ty + size/2 + 6);
                ctx.stroke();
                // надпись LOCK
                ctx.font = "bold 10px monospace";
                ctx.fillStyle = "#f88";
                ctx.fillText("🔒 TARGET", tx-25, ty - size/2 - 4);
                ctx.fillText("LOCK", tx-15, ty + size/2 + 12);
                ctx.restore();
            }
        }
        
        // ========== ОТРИСОВКА HUD (Питч/Ролл — вверху слева, компас — справа увеличен) ==========
        function drawAttitudeIndicators() {
            // Блок питч/ролл (слева вверху)
            ctx.font = "bold 14px 'Courier New'";
            ctx.fillStyle = "#0f0";
            ctx.fillText(`PITCH ${pitch.toFixed(1)}°`, 20, 48);
            ctx.fillText(`ROLL ${roll.toFixed(1)}°`, 20, 78);
            ctx.fillText(`YAW ${Math.floor(yaw)}°`, 20, 108);
            ctx.fillText(`BAT ${batteryVoltage.toFixed(1)}V`, 20, 138);
            // Индикатор RSSI графический
            ctx.fillStyle = `rgba(0, 255, 0, 0.5)`;
            ctx.fillRect(20, 152, (rssi/100)*70, 8);
            ctx.strokeStyle = "#0f0";
            ctx.strokeRect(20, 152, 70, 8);
            ctx.fillStyle = "#0f0";
            ctx.fillText(`RSSI ${Math.floor(rssi)}%`, 20, 168);
        }
        
        // Увеличенный компас (справа вверху, крупнее)
        function drawCompass() {
            let compassX = width - 95;
            let compassY = 80;
            let radius = 58;
            ctx.save();
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(compassX, compassY, radius, 0, Math.PI*2);
            ctx.strokeStyle = "#0f0";
            ctx.lineWidth = 1.5;
            ctx.stroke();
            for(let deg = 0; deg < 360; deg += 30) {
                let rad = (deg - yaw) * Math.PI/180;
                let x1 = compassX + Math.sin(rad) * (radius-10);
                let y1 = compassY - Math.cos(rad) * (radius-10);
                let mark = (deg === 0) ? "N" : (deg === 90 ? "E" : (deg === 180 ? "S" : (deg === 270 ? "W" : deg)));
                ctx.fillStyle = "#0f0";
                ctx.font = deg % 90 === 0 ? "bold 14px monospace" : "10px monospace";
                ctx.fillText(mark, x1-6, y1+4);
            }
            // Стрелка курса
            ctx.beginPath();
            ctx.moveTo(compassX, compassY - radius + 8);
            ctx.lineTo(compassX-6, compassY - radius + 18);
            ctx.lineTo(compassX+6, compassY - radius + 18);
            ctx.fillStyle = "#f80";
            ctx.fill();
            ctx.fillStyle = "#0f0";
            ctx.font = "bold 11px monospace";
            ctx.fillText("HDG", compassX-12, compassY-radius-5);
            ctx.restore();
        }
        
        // Ленты скорости и высоты (улучшенная плавность)
        function drawTape(x, y, value, label, unit, alignRight) {
            ctx.font = "bold 13px monospace";
            ctx.fillStyle = "#0f0";
            ctx.fillText(label, alignRight ? x-45 : x+5, y-42);
            let stepVal = 20;
            let startVal = Math.floor(value/stepVal)*stepVal - 60;
            ctx.beginPath();
            ctx.lineWidth = 1;
            for(let v = startVal; v <= startVal+120; v+= stepVal){
                let ty = y + (value - v)*1.3;
                if(ty > 35 && ty < height-35){
                    ctx.beginPath();
                    ctx.moveTo(alignRight ? x-18 : x+18, ty);
                    ctx.lineTo(alignRight ? x : x+28, ty);
                    ctx.stroke();
                    ctx.fillText(Math.floor(v), alignRight ? x-42 : x+22, ty+4);
                }
            }
            ctx.fillStyle = "rgba(0,255,0,0.2)";
            ctx.fillRect(alignRight ? x-42 : x, y-10, 36, 20);
            ctx.fillStyle = "#0f0";
            ctx.font = "bold 18px monospace";
            ctx.fillText(Math.floor(value), alignRight ? x-32 : x+8, y+6);
            ctx.font = "9px monospace";
            ctx.fillText(unit, alignRight ? x-12 : x+40, y+4);
        }
        
        // Искусственный горизонт плавный
        function drawHorizon() {
            ctx.save();
            ctx.translate(width/2, height/2 + 25);
            ctx.rotate(roll * Math.PI / 180);
            ctx.beginPath();
            ctx.moveTo(-200, pitch * 1.9);
            ctx.lineTo(200, pitch * 1.9);
            ctx.lineWidth = 2.2;
            ctx.strokeStyle = "#0f0";
            ctx.stroke();
            for(let ang = -30; ang <= 30; ang += 10) {
                let yOff = ang * 1.5 + pitch * 1.9;
                if(Math.abs(yOff) < 150){
                    ctx.beginPath();
                    ctx.moveTo(ang===0? -45:-25, yOff);
                    ctx.lineTo(ang===0? 45:25, yOff);
                    ctx.stroke();
                    ctx.fillStyle="#0f0";
                    ctx.font="10px monospace";
                    ctx.fillText(ang+"°", 55, yOff+4);
                    ctx.fillText(ang+"°", -75, yOff+4);
                }
            }
            ctx.restore();
        }
        
        // Статусная строка + микрофон
        function drawBottomStatus() {
            let statusStr = sensorsLinked ? "◉ GYRO-LINK" : "◎ GYRO-OFF";
            statusStr += cameraActive ? " | 📷 FPV" : " | 📷 CAM-OFF";
            if(micActive) statusStr += " | 🎙️ AUDIO";
            ctx.fillStyle = "#0f0";
            ctx.font = "9px monospace";
            ctx.fillText(statusStr, 18, height-16);
            ctx.fillText(`DRONE SYS v.4.2 | ${new Date().toLocaleTimeString()}`, width-240, height-12);
            if(micActive && micLevel>0.05){
                ctx.fillStyle = `rgba(0,255,0,${0.2+micLevel*0.3})`;
                ctx.fillRect(width-45, height-28, 15, 8);
            }
        }
        
        // Эффект тревоги (ALERT MODE)
        function drawAlertEffect() {
            if(alertMode && !objectDetectionActive && (Math.floor(frame/12)%2===0)){
                ctx.fillStyle = "rgba(255, 30, 0, 0.18)";
                ctx.fillRect(0,0,width,height);
                ctx.fillStyle = "#f44";
                ctx.font = "bold 16px monospace";
                ctx.fillText("⚠️ COMBAT ALERT ⚠️", width/2-100, 45);
            }
        }
        
        // ========== ОСНОВНОЙ ЦИКЛ АНИМАЦИИ (плавный, 60fps) ==========
        function animate() {
            frame++;
            updateSimulatedData();
            updateMicLevel();
            updateObjectScan();      // прогресс сканирования объектов
            
            ctx.clearRect(0, 0, width, height);
            drawHorizon();
            drawTape(width * 0.08, height/2, speed, "SPD", "km/h", false);
            drawTape(width * 0.92, height/2, altitude, "ALT", "m", true);
            drawAttitudeIndicators();
            drawCompass();
            drawTargetingFrame();    // рамка обнаружения / захват цели
            drawAlertEffect();
            drawBottomStatus();
            
            // Сканирующая линия CRT
            ctx.fillStyle = 'rgba(0, 255, 0, 0.035)';
            ctx.fillRect(0, (frame * 2.5) % height, width, 4);
            requestAnimationFrame(animate);
        }
        
        // ========== НАЗНАЧЕНИЕ КНОПОК (обновленный функционал) ==========
        resetBtn.onclick = () => {
            startObjectScan();    // Запуск обнаружения объектов с анимированной рамкой
            resetBtn.style.transform = "scale(0.96)";
            setTimeout(() => { resetBtn.style.transform = ""; }, 150);
            sysStatus.innerHTML = "🔍 OBJECT SCAN ACTIVE";
        };
        
        alertBtn.onclick = () => {
            engageTargetLock();   // Захват цели + тревога
            alertBtn.style.transform = "scale(0.96)";
            setTimeout(() => { alertBtn.style.transform = ""; }, 150);
        };
        
        // Инициализация
        initCamera();
        initGyroscope();
        animate();
        
        // Возобновление аудио контекста при касании
        document.body.addEventListener('touchstart', () => {
            if(audioContext && audioContext.state === 'suspended') audioContext.resume();
        }, { once: true });
        
        // Сброс стилей при загрузке
        sysStatus.innerHTML = "⛁ SENSORS READY | PRESS LINK";
    })();
</script>
</body>
</html>
